name: Scrape Prices Daily

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Bakı vaxtı
  workflow_dispatch:
    inputs:
      store:
        description: 'Mağaza (all, araz, oba, bravo, neptun, rahat)'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Asılılıqları yüklə
        run: pip install -r requirements.txt

      - name: Scraper işlət
        run: python scrapers/scraper.py --store "${{ github.event.inputs.store || 'all' }}"

      - name: Nəticəni GitHub-a yüklə
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@qiymet.az"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Qiymətlər yeniləndi"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
