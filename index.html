<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QİYMƏTMÜQAYİSƏ — Azərbaycan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono','Courier New',monospace;background:#f5f0e8;color:#1a1a1a;min-height:100vh}
header{background:#1a1a1a;color:#f5f0e8;padding:24px 32px;border-bottom:4px solid #d4a853}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px}
h1 span{color:#d4a853}
.subtitle{margin-top:4px;font-size:11px;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
.last-update{text-align:right;font-size:11px;opacity:.5}
.last-update b{color:#d4a853;opacity:1;display:block}
.main{max-width:1400px;margin:0 auto;padding:24px 32px}
input{width:100%;padding:12px 16px;border:2px solid #1a1a1a;background:white;font-family:inherit;font-size:15px;outline:none;margin-bottom:24px}

/* Category Grid */
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.cat-card{background:white;border:2px solid #1a1a1a;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-4px);box-shadow:0 8px 16px rgba(0,0,0,.12);border-color:#d4a853}
.cat-card.active{background:#1a1a1a;color:#f5f0e8;border-color:#d4a853}
.cat-card.active .cat-icon{background:#d4a853;color:#1a1a1a}
.cat-icon{width:48px;height:48px;background:#f5f0e8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;transition:all .2s}
.cat-name{font-size:13px;font-weight:500;letter-spacing:.03em}
.cat-count{font-size:11px;opacity:.5;margin-top:4px}

.section-title{background:#1a1a1a;color:#f5f0e8;padding:12px 20px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:2px;margin-top:32px;display:flex;align-items:center;gap:8px}
.table-wrap{overflow-x:auto;border:2px solid #1a1a1a;margin-bottom:4px}
table{width:100%;border-collapse:collapse;background:white}
thead tr{background:#1a1a1a;color:#f5f0e8}
th{padding:12px 16px;text-align:center;font-size:11px;letter-spacing:.08em;font-weight:500;white-space:nowrap}
th.left{text-align:left;min-width:220px}
td{padding:11px 16px;border-bottom:1px solid #e8e0d0;font-size:13px;text-align:center}
td.left{text-align:left}
tr.even{background:#fafafa}tr.odd{background:white}
.best{background:#fffbe6;font-weight:700;color:#b8860b}
.worst{background:#fff5f5;color:#cc3333}
.none{color:#ccc}
.saving{display:inline-block;padding:2px 8px;font-size:11px;font-weight:500;border-radius:2px}
.saving.g{background:#e8f5e9;color:#2e7d32}
.saving.s{background:#f5f5f5;color:#999}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.footer{margin-top:48px;padding:20px 0;border-top:2px solid #ddd;font-size:11px;color:#999;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:64px;color:#999;font-size:14px}
.back-btn{background:#1a1a1a;color:#f5f0e8;border:none;padding:8px 16px;font-family:inherit;font-size:12px;cursor:pointer;margin-bottom:16px;letter-spacing:.05em}
.back-btn:hover{background:#d4a853;color:#1a1a1a}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>🛒 QİYMƏT<span>MÜQAYİSƏ</span></h1>
      <p class="subtitle">Azərbaycan ərzaq qiymətləri müqayisəsi</p>
    </div>
    <div class="last-update">📡 Son yenilənmə<b id="lastUpdate">yüklənir...</b></div>
  </div>
</header>
<div class="main">
  <input id="search" type="text" placeholder="Axtar... (məsələn: Milla, Azərsüd, 3.2%)" oninput="handleSearch()"/>
  <div id="categoryView"></div>
  <div id="content"></div>
  <div class="footer">
    <span>Qiymətlər ₼ ilə · Hər gün avtomatik yenilənir</span>
    <span>Bravo · Neptun · Rahat · OBA</span>
  </div>
</div>
<script>
const COLORS={"Bravo":"#e63946","Neptun":"#6366f1","Rahat":"#2a9d8f","OBA":"#f4a261"};

// Unique icons for each category

  "şor":"🥛"

let allData=null, activeCategory=null, searchQuery="";

fetch("/qiymet-muqayise/data/prices.json")
  .then(r=>r.json())
  .then(data=>{
    if(data.category && data.stores){
      const catId=data.category.replace(/\s/g,"_").toLowerCase();
      data.categories={};
      data.categories[catId]={name:data.category,stores:data.stores};
    }
    allData=data;
    document.getElementById("lastUpdate").textContent=data.last_updated;
    showCategoryGrid();
  })
  .catch(()=>{
    document.getElementById("content").innerHTML='<div class="empty">❌ Qiymətlər yüklənə bilmədi.</div>';
  });

function getIcon(catId, catName){
  // Direct match by category ID
  if(CATEGORY_ICONS[catId]) return CATEGORY_ICONS[catId];
  
  // Match by normalized name
  const normalized = catName.toLowerCase()
    .replace(/ə/g,"e")
    .replace(/ı/g,"i")
    .replace(/ö/g,"o")
    .replace(/ü/g,"u")
    .replace(/ç/g,"c")
    .replace(/ş/g,"sh")
    .replace(/ğ/g,"g")
    .replace(/\s+/g,"_");
  
  if(CATEGORY_ICONS[normalized]) return CATEGORY_ICONS[normalized];
  
  // Partial match
  for(let key in CATEGORY_ICONS){
    if(catId.includes(key) || normalized.includes(key)){
      return CATEGORY_ICONS[key];
    }
  }
  
  // Default icons by category type
  if(catName.toLowerCase().includes("süd") || catName.toLowerCase().includes("sud")) return "🥛";
  if(catName.toLowerCase().includes("ət") || catName.toLowerCase().includes("et")) return "🥩";
  if(catName.toLowerCase().includes("tərəvəz") || catName.toLowerCase().includes("terevez")) return "🥗";
  if(catName.toLowerCase().includes("meyvə") || catName.toLowerCase().includes("meyve")) return "🍎";
  if(catName.toLowerCase().includes("yağ") || catName.toLowerCase().includes("yag")) return "🫒";
  if(catName.toLowerCase().includes("içki") || catName.toLowerCase().includes("icki")) return "🧃";
  if(catName.toLowerCase().includes("şirniyyat") || catName.toLowerCase().includes("shirniyyat")) return "🍬";
  
  return "📦";
}

function countProducts(stores){
  let total=0;
  Object.values(stores).forEach(items=>total+=items.length);
  return total;
}

function showCategoryGrid(){
  activeCategory=null;
  const cats=Object.entries(allData.categories);
  const html=`
    <div class="category-grid">
      ${cats.map(([id,cat])=>{
        const count=countProducts(cat.stores);
        if(count===0) return "";
        const icon=getIcon(id,cat.name);
        return `
          <div class="cat-card" onclick="selectCategory('${id}')">
            <div class="cat-icon">${icon}</div>
            <div class="cat-name">${cat.name}</div>
            <div class="cat-count">${count} məhsul</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
  document.getElementById("categoryView").innerHTML=html;
  document.getElementById("content").innerHTML="";
}

function selectCategory(catId){
  activeCategory=catId;
  searchQuery="";
  document.getElementById("search").value="";
  document.getElementById("categoryView").innerHTML=`<button class="back-btn" onclick="showCategoryGrid()">← Bütün kateqoriyalar</button>`;
  renderCategory();
}

function handleSearch(){
  searchQuery=document.getElementById("search").value.toLowerCase();
  if(activeCategory){
    renderCategory();
  }else if(searchQuery){
    document.getElementById("categoryView").innerHTML=`<button class="back-btn" onclick="clearSearch()">← Bütün kateqoriyalar</button>`;
    renderAllMatching();
  }else{
    showCategoryGrid();
  }
}

function clearSearch(){
  searchQuery="";
  document.getElementById("search").value="";
  showCategoryGrid();
}

function normalize(s){
  return s.toLowerCase().replace(/\s+/g," ").replace(/,/g,".").replace(/süd/g,"sud").trim();
}

function similarity(a,b){
  const wa=normalize(a).split(" ");
  const wb=normalize(b).split(" ");
  const common=wa.filter(w=>wb.includes(w)&&w.length>1);
  return common.length/Math.max(wa.length,wb.length);
}

function matchProducts(stores,storeNames){
  let all=[];
  storeNames.forEach(s=>{(stores[s]||[]).forEach(item=>all.push({...item,store:s}));});
  const groups=[], used=new Set();
  all.forEach((item,i)=>{
    if(used.has(i)) return;
    const group={name:item.name,stores:{}};
    group.stores[item.store]=item.price;
    used.add(i);
    all.forEach((other,j)=>{
      if(used.has(j)||other.store===item.store) return;
      if(similarity(item.name,other.name)>=0.6){group.stores[other.store]=other.price;used.add(j);}
    });
    groups.push(group);
  });
  return groups;
}

function renderCategory(){
  if(!allData.categories[activeCategory]){
    document.getElementById("content").innerHTML='<div class="empty">Kateqoriya tapılmadı</div>';
    return;
  }
  
  const cat=allData.categories[activeCategory];
  const storeNames=["Bravo","Neptun","Rahat","OBA"];
  let groups=matchProducts(cat.stores,storeNames);
  
  if(searchQuery){
    groups=groups.filter(g=>g.name.toLowerCase().includes(searchQuery));
  }

  if(!groups.length){
    document.getElementById("content").innerHTML='<div class="empty">Heç nə tapılmadı</div>';
    return;
  }

  const icon=getIcon(activeCategory,cat.name);
  let html=`<div class="section-title">${icon} ${cat.name.toUpperCase()} — ${groups.length} məhsul</div>`;
  html+=`<div class="table-wrap"><table><thead><tr>
    <th class="left">MƏHSUL</th>
    ${storeNames.map(s=>`<th><span class="dot" style="background:${COLORS[s]}"></span>${s.toUpperCase()}</th>`).join("")}
    <th>QƏNAƏT</th>
  </tr></thead><tbody>`;

  groups.sort((a,b)=>{
    const minA=Math.min(...Object.values(a.stores).filter(Boolean));
    const minB=Math.min(...Object.values(b.stores).filter(Boolean));
    return minA-minB;
  });

  groups.forEach((g,i)=>{
    const prices=storeNames.map(s=>g.stores[s]||null);
    const valid=prices.filter(Boolean);
    const min=valid.length?Math.min(...valid):null;
    const max=valid.length?Math.max(...valid):null;
    const saving=min&&max&&max>min?`<span class="saving g">−₼${(max-min).toFixed(2)}</span>`:`<span class="saving s">—</span>`;
    html+=`<tr class="${i%2===0?'even':'odd'}">
      <td class="left">${g.name}</td>
      ${storeNames.map(s=>{
        const p=g.stores[s];
        if(!p) return `<td class="none">—</td>`;
        const best=p===min&&valid.length>1;
        const worst=p===max&&min!==max;
        return `<td class="${best?'best':worst?'worst':''}">${best?'★ ':worst?'● ':''}₼${p.toFixed(2)}</td>`;
      }).join("")}
      <td>${saving}</td>
    </tr>`;
  });

  html+=`</tbody></table></div>`;
  document.getElementById("content").innerHTML=html;
}

function renderAllMatching(){
  const storeNames=["Bravo","Neptun","Rahat","OBA"];
  let html="";

  Object.entries(allData.categories).forEach(([catId,cat])=>{
    let groups=matchProducts(cat.stores,storeNames);
    groups=groups.filter(g=>g.name.toLowerCase().includes(searchQuery));
    if(!groups.length) return;

    const icon=getIcon(catId,cat.name);
    html+=`<div class="section-title">${icon} ${cat.name.toUpperCase()} — ${groups.length} məhsul</div>`;
    html+=`<div class="table-wrap"><table><thead><tr>
      <th class="left">MƏHSUL</th>
      ${storeNames.map(s=>`<th><span class="dot" style="background:${COLORS[s]}"></span>${s.toUpperCase()}</th>`).join("")}
      <th>QƏNAƏT</th>
    </tr></thead><tbody>`;

    groups.sort((a,b)=>{
      const minA=Math.min(...Object.values(a.stores).filter(Boolean));
      const minB=Math.min(...Object.values(b.stores).filter(Boolean));
      return minA-minB;
    });

    groups.forEach((g,i)=>{
      const prices=storeNames.map(s=>g.stores[s]||null);
      const valid=prices.filter(Boolean);
      const min=valid.length?Math.min(...valid):null;
      const max=valid.length?Math.max(...valid):null;
      const saving=min&&max&&max>min?`<span class="saving g">−₼${(max-min).toFixed(2)}</span>`:`<span class="saving s">—</span>`;
      html+=`<tr class="${i%2===0?'even':'odd'}">
        <td class="left">${g.name}</td>
        ${storeNames.map(s=>{
          const p=g.stores[s];
          if(!p) return `<td class="none">—</td>`;
          const best=p===min&&valid.length>1;
          const worst=p===max&&min!==max;
          return `<td class="${best?'best':worst?'worst':''}">${best?'★ ':worst?'● ':''}₼${p.toFixed(2)}</td>`;
        }).join("")}
        <td>${saving}</td>
      </tr>`;
    });

    html+=`</tbody></table></div>`;
  });

  if(!html) html=`<div class="empty">Heç nə tapılmadı</div>`;
  document.getElementById("content").innerHTML=html;
}
</script>
</body>
</html>
