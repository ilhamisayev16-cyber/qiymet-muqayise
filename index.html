<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QiymətMüqayisə</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f4ef; --bg2:#fff; --bg3:#f0ece4; --border:#e2dbd0;
  --text:#1a1612; --muted:#9a9088; --accent:#c8410b; --ink:#2d2620;
  --cheap-c:#16a34a; --cheap-bg:#f0fdf4;
  --exp-c:#dc2626; --exp-bg:#fff1f1;
  --wolt:#009de0;
  --bravo:#d72b3f; --oba:#1a5fe0; --araz:#7c3aed; --neptun:#0d9b6e; --rahat:#e05c14;
  --r:10px; --r2:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
header{
  background:var(--ink);padding:11px 18px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:10px;
}
.logo{flex:1;font-size:17px;font-weight:800;color:#fff;}
.logo em{color:var(--accent);font-style:normal;}
#last-upd{font-size:10px;font-family:'Space Mono',monospace;color:rgba(255,255,255,.28);}
#back-btn{
  display:none;align-items:center;gap:5px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
  color:#fff;padding:6px 12px;border-radius:var(--r2);
  cursor:pointer;font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;
}
#back-btn svg{width:12px;height:12px;}

/* HOME */
#home-view{padding:16px;}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;}
.cat-card{
  background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r);
  padding:13px 12px 11px;cursor:pointer;transition:all .16s;
  display:flex;flex-direction:column;gap:5px;
}
.cat-card:hover{border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 3px 14px rgba(200,65,11,.1);}
.cat-icon{font-size:22px;line-height:1;}
.cat-name{font-size:12px;font-weight:700;line-height:1.2;}
.cat-meta{display:flex;align-items:center;justify-content:space-between;}
.cat-cnt{font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;}
.cat-dots{display:flex;gap:3px;}
.sdot{width:6px;height:6px;border-radius:50%;}

#loading{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;}
.spinner{width:26px;height:26px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── CATEGORY VIEW ── */
#cat-view{display:none;}
.cat-top{
  background:var(--ink);padding:14px 18px 12px;
  display:flex;align-items:center;gap:10px;
}
#cat-icon{font-size:26px;flex-shrink:0;}
#cat-title{font-size:17px;font-weight:800;color:#fff;}
#cat-sub{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px;
  font-family:'Space Mono',monospace;}

/* ── UNIT PRICE SUMMARY CARDS ── */
.unit-section{
  padding:12px 18px 4px;
  background:var(--bg3);
  border-bottom:1px solid var(--border);
}
.unit-label{font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.unit-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:10px;
}
.unit-card{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r2);padding:9px 10px;
}
.unit-card.has-data{border-color:rgba(22,163,74,.25);}
.unit-heading{font-size:9px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
.unit-price{
  font-family:'Space Mono',monospace;font-size:14px;font-weight:700;
  color:var(--cheap-c);line-height:1;
}
.unit-empty{font-size:10px;color:var(--border);}
.unit-brand{font-size:10px;color:var(--text);margin-top:3px;
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.unit-store{display:inline-flex;align-items:center;gap:3px;
  font-size:9px;color:var(--muted);margin-top:2px;}
.unit-store-dot{width:5px;height:5px;border-radius:50%;}

/* ── TOOLBAR ── */
.toolbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:9px 18px;display:flex;align-items:center;gap:7px;
  position:sticky;top:44px;z-index:100;
}
#srch{
  flex:1;background:var(--bg3);border:1.5px solid var(--border);
  color:var(--text);padding:6px 10px;border-radius:var(--r2);
  font-size:12px;font-family:'Outfit',sans-serif;outline:none;
}
#srch:focus{border-color:var(--accent);}
#srch::placeholder{color:var(--muted);}
.srt{
  background:var(--bg3);border:1.5px solid var(--border);color:var(--muted);
  padding:5px 9px;border-radius:var(--r2);cursor:pointer;
  font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;white-space:nowrap;
}
.srt.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ── PRODUCT LIST ── */
.prod-list{padding:10px 18px 40px;}
.prod-row{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r);padding:11px 14px;
  margin-bottom:7px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;align-items:start;
}
.prod-name{font-size:13px;font-weight:600;line-height:1.3;color:var(--text);}
.prod-savings{
  font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
  color:var(--cheap-c);text-align:right;white-space:nowrap;flex-shrink:0;
  padding-top:1px;
}
.prod-savings.zero{color:var(--border);font-size:11px;}
/* store price line */
.store-prices{
  display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;align-items:center;
}
.sp-item{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;white-space:nowrap;
}
.sp-store{font-weight:600;color:var(--muted);}
.sp-price{
  font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
  color:var(--text);
}
/* cheapest */
.sp-item.is-cheap .sp-store{color:var(--cheap-c);}
.sp-item.is-cheap .sp-price{color:var(--cheap-c);}
.star{color:var(--cheap-c);font-size:11px;}
/* most expensive */
.sp-item.is-exp .sp-store{color:var(--exp-c);}
.sp-item.is-exp .sp-price{color:var(--exp-c);}
.reddot{
  width:7px;height:7px;border-radius:50%;
  background:var(--exp-c);flex-shrink:0;
}
/* wolt only */
.sp-item.wolt-only .sp-store{color:var(--wolt);opacity:.75;}
.sp-item.wolt-only .sp-price{color:var(--wolt);opacity:.75;}
.wbadge{
  font-family:'Space Mono',monospace;font-size:7px;font-weight:700;
  background:var(--wolt);color:#fff;border-radius:2px;padding:1px 3px;
  vertical-align:super;margin-left:1px;
}
.sep{color:var(--border);font-size:14px;margin:0 1px;}

.empty-st{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* MOBILE */
@media(max-width:600px){
  .unit-cards{grid-template-columns:repeat(2,1fr);}
  .unit-price{font-size:13px;}
  .toolbar{top:40px;padding:8px 12px;}
  .prod-list{padding:8px 12px 30px;}
  #home-view{padding:12px;}
  .cat-cards{gap:7px;}
  #cat-title{font-size:15px;}
  .cat-top{padding:12px;}
}
@media(max-width:380px){
  .cat-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <button id="back-btn" onclick="showHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Geri
  </button>
  <div class="logo">Qiymət<em>Müqayisə</em></div>
  <div id="last-upd"></div>
</header>

<!-- HOME -->
<div id="home-view">
  <div class="sec-label">Kateqoriyalar</div>
  <div id="loading"><div class="spinner"></div>Yüklənir…</div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- CATEGORY -->
<div id="cat-view">
  <div class="cat-top">
    <div id="cat-icon"></div>
    <div>
      <div id="cat-title"></div>
      <div id="cat-sub"></div>
    </div>
  </div>

  <!-- Unit price summary -->
  <div class="unit-section">
    <div class="unit-label">Vahid qiyməti üzrə ən ucuz</div>
    <div class="unit-cards" id="unit-cards"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Məhsul axtar…" oninput="rerender()"/>
    <button class="srt on" onclick="setSort('name',this)">A→Z</button>
    <button class="srt"    onclick="setSort('asc',this)">Ucuz↑</button>
    <button class="srt"    onclick="setSort('sav',this)">Qənaət↓</button>
  </div>

  <!-- Product list -->
  <div class="prod-list" id="prod-list"></div>
  <div class="empty-st" id="empty" style="display:none">Məhsul tapılmadı</div>
</div>

<script>
const SC={Bravo:"#d72b3f",OBA:"#1a5fe0",Araz:"#7c3aed",Neptun:"#0d9b6e",Rahat:"#e05c14"};
const CI={
  sud:"🥛",yumurta:"🥚",kere_yagi:"🧈",pendir:"🧀",qatiq:"🫙",xama:"🥄",kefir:"🥛",ayran:"🥤",
  kartof:"🥔",pomidor:"🍅",xiyar:"🥒",soyan:"🧅",kelem:"🥬",yerkoyu:"🥕",cuqundur:"🫚",
  badimcan:"🍆",biber:"🌶️",sarimsaq:"🧄",ispanaq:"🌿",
  alma:"🍎",armud:"🍐",saftal:"🍑",gilas:"🍒",uzum:"🍇",banan:"🍌",kivi:"🥝",
  limon:"🍋",portaqal:"🍊",nar:"🍎",
  toyuq:"🍗",dana_ati:"🥩",qoyun_ati:"🍖",hindi:"🦃",kolbasa:"🌭",sosis:"🌭",baliq:"🐟",
  duyu:"🍚",merci:"🫘",noxud:"🟡",fasulya:"🫘",qarabashaq:"🌾",yulaf:"🌾",
  un:"🌾",makaron:"🍝",corek:"🍞",pecenye:"🍪",
  cay:"🍵",qehve:"☕",sire:"🧃",su:"💧",kola:"🥤",energetik:"⚡",
  sokolad:"🍫",halva:"🍬",bal:"🍯",dondurma:"🍦",
  zeytun_yagi:"🫒",bitki_yagi:"🌻",mayonez:"🫙",ketcup:"🍅",
  duz:"🧂",sekerqum:"🍬",istiot:"🌶️",
};

let DATA=null, STORES=[], sortMode='name', allRows=[];

// ── Weight parser → returns grams or ml ───────────────────────────────────
function parseWeight(name){
  const n=name.toLowerCase();
  const pats=[
    [/(\d+[\.,]?\d*)\s*kq\b/i,  1000],
    [/(\d+[\.,]?\d*)\s*kg\b/i,  1000],
    [/(\d+[\.,]?\d*)\s*litr/i,  1000],
    [/(\d+[\.,]?\d*)\s*\bl\b/i, 1000],
    [/(\d+[\.,]?\d*)\s*lt\b/i,  1000],
    [/(\d+[\.,]?\d*)\s*ml\b/i,  1],
    [/(\d+[\.,]?\d*)\s*\bq\b/i, 1],
    [/(\d+[\.,]?\d*)\s*gr?\b/i, 1],
    [/(\d+[\.,]?\d*)\s*г\b/i,   1],
    [/(\d+[\.,]?\d*)\s*кг\b/i,  1000],
  ];
  for(const[re,mult] of pats){
    const m=n.match(re);
    if(m){
      const v=parseFloat(m[1].replace(',','.'));
      if(v>0) return {g:v*mult, raw:v, unit:mult===1000?'kq/L':'q/ml'};
    }
  }
  return null;
}

// price per X grams
function perUnit(price, wg, target){
  if(!wg||price==null) return null;
  return Math.round(price/wg.g*target*100)/100;
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init(){
  try{
    const r=await fetch('data/prices.json');
    if(!r.ok) throw new Error(r.status);
    DATA=await r.json();
    STORES=DATA.stores||["Bravo","OBA","Araz","Neptun","Rahat"];
    if(DATA.last_updated)
      document.getElementById('last-upd').textContent='↺ '+DATA.last_updated;
    buildGrid();
  }catch(e){
    document.getElementById('loading').innerHTML=
      `<div style="color:#d72b3f;font-size:14px">❌ data/prices.json yüklənmədi<br>
      <small style="opacity:.6;font-size:11px">python -m http.server 8000 işlətməyi unutma</small></div>`;
  }
}

function buildGrid(){
  document.getElementById('loading').style.display='none';
  const grid=document.getElementById('cat-grid');
  let html='';
  for(const[id,cat] of Object.entries(DATA.categories)){
    const total=Object.values(cat.stores||{}).reduce((s,a)=>s+a.length,0);
    if(!total) continue;
    const dots=STORES
      .filter(s=>cat.stores&&cat.stores[s]&&cat.stores[s].length>0)
      .map(s=>`<div class="sdot" style="background:${SC[s]||'#888'}"></div>`).join('');
    html+=`<div class="cat-card" onclick="openCat('${id}')">
      <div class="cat-icon">${CI[id]||'📦'}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-meta">
        <div class="cat-cnt">${total}</div>
        <div class="cat-dots">${dots}</div>
      </div></div>`;
  }
  grid.innerHTML=html||'<div style="color:var(--muted)">Məlumat yoxdur</div>';
}

// ── Similarity ────────────────────────────────────────────────────────────
function sim(a,b){
  const wa=new Set(a.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  const wb=new Set(b.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  let i=0;wa.forEach(w=>{if(wb.has(w))i++;});
  return i/Math.max(wa.size,wb.size,1);
}

// ── Open category ─────────────────────────────────────────────────────────
function openCat(catId){
  sortMode='name';
  document.querySelectorAll('.srt').forEach((b,i)=>b.classList.toggle('on',i===0));
  document.getElementById('srch').value='';

  const cat=DATA.categories[catId];
  document.getElementById('cat-icon').textContent=CI[catId]||'📦';
  document.getElementById('cat-title').textContent=cat.name;

  // Build store items map
  const storeItems={};
  STORES.forEach(s=>{storeItems[s]=(cat.stores&&cat.stores[s])?[...cat.stores[s]]:[];});

  // Build unified rows
  const anchor=STORES.slice().sort((a,b)=>storeItems[b].length-storeItems[a].length)[0];
  const used={};STORES.forEach(s=>used[s]=new Set());
  const unified=[];

  storeItems[anchor].forEach((item,idx)=>{
    const row={name:item.name, prices:{}};
    row.prices[anchor]={own:item.price, wolt:item.wolt_price};
    used[anchor].add(idx);
    STORES.filter(s=>s!==anchor).forEach(s=>{
      let bs=0,bi=-1;
      storeItems[s].forEach((si,i)=>{
        if(used[s].has(i))return;
        const v=sim(item.name,si.name);
        if(v>bs){bs=v;bi=i;}
      });
      if(bs>=0.5&&bi>=0){
        row.prices[s]={own:storeItems[s][bi].price,wolt:storeItems[s][bi].wolt_price};
        used[s].add(bi);
      }
    });
    unified.push(row);
  });
  STORES.filter(s=>s!==anchor).forEach(s=>{
    storeItems[s].forEach((item,idx)=>{
      if(used[s].has(idx))return;
      unified.push({name:item.name,prices:{[s]:{own:item.price,wolt:item.wolt_price}}});
    });
  });

  // Pre-compute stats
  unified.forEach(row=>{
    const own=STORES
      .filter(s=>row.prices[s]&&row.prices[s].own!=null)
      .map(s=>({store:s,price:row.prices[s].own}))
      .sort((a,b)=>a.price-b.price);
    row._own=own;
    row._min=own[0]||null;
    row._max=own[own.length-1]||null;
    row._saving=own.length>1?Math.round((row._max.price-row._min.price)*100)/100:0;
    row._wg=parseWeight(row.name);
  });

  allRows=unified;
  const total=unified.length;
  const act=STORES.filter(s=>storeItems[s].length>0).join(', ');
  document.getElementById('cat-sub').textContent=`${total} məhsul • ${act}`;

  buildUnitCards(unified);
  rerender();

  document.getElementById('home-view').style.display='none';
  document.getElementById('cat-view').style.display='block';
  document.getElementById('back-btn').style.display='flex';
  window.scrollTo(0,0);
}

// ── Unit price summary cards ───────────────────────────────────────────────
function buildUnitCards(rows){
  // targets: label, grams
  const targets=[
    {label:'100 q / 100 ml', g:100},
    {label:'1 kq / 1 L',     g:1000},
  ];

  // For each target, find cheapest per-unit across all rows + all stores
  const cards=document.getElementById('unit-cards');

  // We'll compute for 100q and 1kq separately
  // For 100q: show cheapest ₼/100g product
  // For 1kq: show cheapest ₼/1000g product
  // Do it per store too — find overall cheapest

  const targets2=[
    {label:'100 q',  g:100,  desc:'yüz qrama görə'},
    {label:'100 ml', g:100,  desc:'yüz millilitrə görə'},
    {label:'1 kq',   g:1000, desc:'bir kiloqrama görə'},
    {label:'1 L',    g:1000, desc:'bir litrə görə'},
  ];

  // Separate solid and liquid
  function isLiquid(name){
    const n=name.toLowerCase();
    return /\d\s*ml\b|\d\s*l\b|\d\s*litr/.test(n);
  }
  function isSolid(name){
    const n=name.toLowerCase();
    return /\d\s*q\b|\d\s*g\b|\d\s*kq\b|\d\s*kg\b|\d\s*gr?\b/.test(n) && !isLiquid(name);
  }

  const groups=[
    {label:'100 q',  g:100,  filter:r=>isSolid(r.name)},
    {label:'100 ml', g:100,  filter:r=>isLiquid(r.name)},
    {label:'1 kq',   g:1000, filter:r=>isSolid(r.name)},
    {label:'1 L',    g:1000, filter:r=>isLiquid(r.name)},
  ];

  let html='';
  groups.forEach(grp=>{
    let best=null; // {unitPrice, store, name}
    rows.filter(grp.filter).forEach(row=>{
      if(!row._wg) return;
      // check each store
      STORES.forEach(s=>{
        const p=row.prices[s];
        if(!p||p.own==null) return;
        const up=perUnit(p.own, row._wg, grp.g);
        if(up==null||up<=0) return;
        if(!best||up<best.unitPrice){
          best={unitPrice:up, store:s, name:row.name};
        }
      });
    });

    if(best){
      const storeColor=SC[best.store]||'#888';
      // shorten name
      let shortName=best.name.length>22?best.name.slice(0,22)+'…':best.name;
      html+=`<div class="unit-card has-data">
        <div class="unit-heading">${grp.label}</div>
        <div class="unit-price">₼${fmt(best.unitPrice)}</div>
        <div class="unit-brand">${esc(shortName)}</div>
        <div class="unit-store">
          <div class="unit-store-dot" style="background:${storeColor}"></div>
          ${best.store}
        </div>
      </div>`;
    } else {
      html+=`<div class="unit-card">
        <div class="unit-heading">${grp.label}</div>
        <div class="unit-empty">—</div>
      </div>`;
    }
  });
  cards.innerHTML=html;
}

// ── Sort + filter ─────────────────────────────────────────────────────────
function getSorted(){
  const q=(document.getElementById('srch').value||'').toLowerCase().trim();
  let rows=q?allRows.filter(r=>r.name.toLowerCase().includes(q)):[...allRows];
  if(sortMode==='name')
    rows.sort((a,b)=>a.name.localeCompare(b.name,'az'));
  else if(sortMode==='asc')
    rows.sort((a,b)=>(a._min?.price??999)-(b._min?.price??999));
  else if(sortMode==='sav')
    rows.sort((a,b)=>b._saving-a._saving);
  return rows;
}

function rerender(){ renderRows(getSorted()); }

// ── Render rows ───────────────────────────────────────────────────────────
function renderRows(rows){
  const list=document.getElementById('prod-list');
  const empty=document.getElementById('empty');
  if(!rows.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  let html='';
  rows.forEach(row=>{
    // Store price items
    let priceParts='';
    const ownStores=row._own; // [{store,price}] sorted asc
    const minPrice=row._min?.price;
    const maxPrice=row._max?.price;
    const multiOwn=ownStores.length>1;

    // Build list of all stores that have data (own or wolt-only)
    const storeEntries=STORES
      .filter(s=>row.prices[s]&&(row.prices[s].own!=null||row.prices[s].wolt!=null))
      .map(s=>({store:s,...row.prices[s]}));

    storeEntries.forEach((entry,i)=>{
      const isCheap = multiOwn && entry.own!=null && entry.own===minPrice;
      const isExp   = multiOwn && entry.own!=null && entry.own===maxPrice && maxPrice!==minPrice;
      const woltOnly= entry.own==null && entry.wolt!=null;
      const displayPrice=entry.own!=null?entry.own:entry.wolt;
      const woltMark=entry.wolt!=null&&entry.own!=null
        ?`<sup class="wbadge">W</sup>`:'';

      let cls='sp-item';
      if(isCheap) cls+=' is-cheap';
      if(isExp)   cls+=' is-exp';
      if(woltOnly) cls+=' wolt-only';

      let indicator='';
      if(isCheap)  indicator=`<span class="star">★</span>`;
      if(isExp)    indicator=`<div class="reddot"></div>`;

      if(i>0) priceParts+=`<span class="sep">·</span>`;
      priceParts+=`<span class="${cls}">
        <span class="sp-store">${entry.store}</span>
        <span class="sp-price">₼${fmt(displayPrice)}${woltMark}</span>
        ${indicator}
      </span>`;
    });

    // Savings
    const saving=row._saving;
    let savingHtml='';
    if(saving>0){
      savingHtml=`<div class="prod-savings">−₼${fmt(saving)}</div>`;
    } else {
      savingHtml=`<div class="prod-savings zero">—</div>`;
    }

    html+=`<div class="prod-row">
      <div>
        <div class="prod-name">${esc(row.name)}</div>
        <div class="store-prices">${priceParts}</div>
      </div>
      ${savingHtml}
    </div>`;
  });
  list.innerHTML=html;
}

function setSort(m,btn){
  sortMode=m;
  document.querySelectorAll('.srt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  rerender();
}

function showHome(){
  document.getElementById('home-view').style.display='block';
  document.getElementById('cat-view').style.display='none';
  document.getElementById('back-btn').style.display='none';
  window.scrollTo(0,0);
}

function fmt(n){return n!=null?Number(n).toFixed(2):'—';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

init();
</script>
</body>
</html>
