<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QiymətMüqayisə</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== CSS VARS ===================== */
:root {
  --bg:       #0b0906;
  --bg-2:     #12100d;
  --bg-3:     #1c1813;
  --bg-4:     #231e18;
  --acc:      #e86820;
  --acc-d:    rgba(232,104,32,.13);
  --acc-glow: rgba(232,104,32,.25);
  --txt:      #f0e8df;
  --txt-2:    #a89880;
  --txt-3:    #5e4e3e;
  --bdr:      rgba(232,104,32,.11);
  --bdr-2:    rgba(255,255,255,.055);

  --bravo:    #e53935;
  --oba:      #1e88e5;
  --araz:     #8e24aa;
  --neptun:   #43a047;
  --rahat:    #e86820;

  --fh: 'Syne',      sans-serif;
  --fm: 'Space Mono',monospace;
  --fb: 'Outfit',    sans-serif;

  --r:  12px;
  --rs: 8px;
}

/* ===================== RESET ===================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--fb);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}

/* dotted grid */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(232,104,32,.14) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;z-index:0;
}
/* ambient glow */
body::after{
  content:'';
  position:fixed;
  top:-25%;left:-15%;
  width:65%;height:70%;
  background:radial-gradient(ellipse,rgba(232,104,32,.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* ===================== HEADER ===================== */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(11,9,6,.93);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--bdr);
}
.hdr{
  max-width:1440px;margin:0 auto;
  height:58px;
  display:flex;align-items:center;gap:1rem;
  padding:0 1.5rem;
}

.logo{
  font-family:var(--fh);font-size:1.05rem;font-weight:800;
  color:var(--acc);text-decoration:none;
  letter-spacing:-.02em;cursor:pointer;flex-shrink:0;white-space:nowrap;
  user-select:none;
}
.logo b{color:var(--txt);font-weight:400}

/* global search */
.gsearch{flex:1;max-width:500px;margin:0 auto;position:relative}
.gsearch svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--txt-3);pointer-events:none;width:15px;height:15px;
}
.gsearch input{
  width:100%;
  background:var(--bg-3);border:1px solid var(--bdr);
  color:var(--txt);font-family:var(--fb);font-size:13px;
  padding:7px 48px 7px 34px;
  border-radius:var(--rs);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.gsearch input::placeholder{color:var(--txt-3)}
.gsearch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-d)}
.g-hint{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-family:var(--fm);font-size:9px;color:var(--txt-3);
  background:var(--bg-2);border:1px solid var(--bdr-2);
  padding:2px 5px;border-radius:4px;pointer-events:none;
}

/* search dropdown */
.gdrop{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg-2);border:1px solid var(--bdr);
  border-radius:var(--r);overflow:hidden;z-index:200;
  box-shadow:0 24px 64px rgba(0,0,0,.65);
  display:none;max-height:380px;overflow-y:auto;
}
.gdrop.on{display:block}
.gdr-item{
  padding:9px 13px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--bdr-2);
  transition:background .12s;
}
.gdr-item:last-child{border:none}
.gdr-item:hover{background:var(--acc-d)}
.gdr-cat{font-size:10px;color:var(--txt-3);background:var(--bg-3);padding:2px 5px;border-radius:3px;flex-shrink:0}
.gdr-name{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdr-store{font-size:10px;flex-shrink:0}
.gdr-price{font-family:var(--fm);font-size:12px;color:var(--acc);flex-shrink:0}
.gdr-empty{padding:16px;text-align:center;font-size:12px;color:var(--txt-3)}

.updated{font-family:var(--fm);font-size:10px;color:var(--txt-3);flex-shrink:0;white-space:nowrap}

/* ===================== MAIN ===================== */
main{
  position:relative;z-index:1;
  max-width:1440px;margin:0 auto;
  padding:0 1.5rem 3rem;
}

/* ===================== HOME ===================== */
#vHome{}
.hero{padding:2.5rem 0 1.75rem}
.hero h1{
  font-family:var(--fh);font-size:clamp(1.75rem,4vw,2.9rem);
  font-weight:800;letter-spacing:-.03em;line-height:1.1;
  margin-bottom:.4rem;
}
.hero h1 em{color:var(--acc);font-style:normal}
.hero p{color:var(--txt-2);font-size:.9rem}

/* stats */
.stats{display:flex;gap:.9rem;margin-bottom:2rem;flex-wrap:wrap}
.sc{
  background:var(--bg-2);border:1px solid var(--bdr);
  border-radius:var(--r);padding:.9rem 1.2rem;
  position:relative;overflow:hidden;flex:1;min-width:120px;
}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc)}
.sc-lbl{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.sc-val{font-family:var(--fm);font-size:1.55rem;font-weight:700}

/* category grid */
.cgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:.9rem;
}
.ccard{
  background:var(--bg-2);border:1px solid var(--bdr);
  border-radius:var(--r);padding:1.4rem;cursor:pointer;
  transition:border-color .2s,transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
  animation:slideUp .4s ease both;
}
.ccard::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 20%,var(--acc-d) 0%,transparent 65%);
  opacity:0;transition:opacity .3s;
}
.ccard:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 0 1px var(--acc-glow)}
.ccard:hover::after{opacity:1}
.ccard:active{transform:translateY(0)}
.cc-em{font-size:1.9rem;margin-bottom:.6rem;display:block}
.cc-nm{font-family:var(--fh);font-size:.9rem;font-weight:700;margin-bottom:.35rem}
.cc-mt{font-size:11px;color:var(--txt-3);font-family:var(--fm)}

@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* skeleton shimmer */
.sk{
  background:linear-gradient(90deg,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
}
.sk-card{border-radius:var(--r);height:116px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===================== CATEGORY VIEW ===================== */
#vCat{display:none}

.cat-hdr{display:flex;align-items:center;gap:1rem;padding:1.4rem 0 .7rem;flex-wrap:wrap}
.back{
  background:var(--bg-3);border:1px solid var(--bdr);color:var(--txt-2);
  padding:6px 13px;border-radius:var(--rs);cursor:pointer;
  font-family:var(--fb);font-size:12px;
  display:flex;align-items:center;gap:5px;transition:all .18s;flex-shrink:0;
}
.back:hover{border-color:var(--acc);color:var(--acc)}
.cat-title{font-family:var(--fh);font-size:1.5rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.45rem}

/* store counters */
.sbadges{display:flex;gap:7px;flex-wrap:wrap;padding:.3rem 0 .9rem}
.sbadge{font-size:11px;font-family:var(--fm);padding:3px 10px;border-radius:20px;border:1px solid}

/* ===== FILTER PANEL ===== */
.fp{
  position:sticky;top:58px;z-index:90;
  background:rgba(11,9,6,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--bdr);
  margin:0 -1.5rem;padding:.55rem 1.5rem;
}
.frow{
  display:flex;align-items:center;gap:6px;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  padding:3px 0;min-height:34px;
}
.frow::-webkit-scrollbar{display:none}
.frow+.frow{border-top:1px solid var(--bdr-2);margin-top:4px;padding-top:7px}
.flbl{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;white-space:nowrap;width:42px}

/* chips */
.chip{
  padding:4px 11px;border-radius:20px;border:1px solid var(--bdr);
  background:transparent;color:var(--txt-2);font-family:var(--fb);font-size:12px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .14s;
}
.chip:hover{border-color:var(--acc);color:var(--txt)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* sort chips */
.schip{
  padding:4px 11px;border-radius:20px;border:1px solid var(--bdr);
  background:transparent;color:var(--txt-2);font-size:12px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .14s;
  font-family:var(--fb);
}
.schip:hover{border-color:var(--acc)}
.schip.on{border-color:var(--acc);color:var(--acc)}

/* range inputs */
.ri{
  width:64px;background:var(--bg-3);border:1px solid var(--bdr);
  color:var(--txt);font-family:var(--fm);font-size:11px;
  padding:4px 7px;border-radius:var(--rs);outline:none;
  -moz-appearance:textfield;
}
.ri::-webkit-outer-spin-button,.ri::-webkit-inner-spin-button{-webkit-appearance:none}
.ri:focus{border-color:var(--acc)}

/* category search in filter row */
.csinp{
  background:var(--bg-3);border:1px solid var(--bdr);color:var(--txt);
  font-family:var(--fb);font-size:12px;
  padding:5px 8px 5px 26px;border-radius:var(--rs);outline:none;
  width:220px;flex-shrink:0;
}
.csinp:focus{border-color:var(--acc)}
.cswrap{position:relative;flex-shrink:0}
.cswrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--txt-3);width:12px;height:12px}

/* pct row */
#pctRow{display:none}
#pctRow.vis{display:flex}

/* ===== UNIT CARDS ===== */
.ucards{display:flex;gap:9px;padding:.9rem 0;overflow-x:auto;scrollbar-width:none}
.ucards::-webkit-scrollbar{display:none}
.ucard{
  background:var(--bg-2);border:1px solid var(--bdr);
  border-radius:var(--r);padding:.75rem 1rem;
  flex-shrink:0;min-width:155px;
}
.uc-lbl{font-size:9px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.uc-price{font-family:var(--fm);font-size:1.05rem;color:var(--acc);font-weight:700}
.uc-name{font-size:11px;color:var(--txt-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc-store{font-size:10px;margin-top:1px}

/* ===== TABLE ===== */
.twrap{
  overflow-x:auto;
  border:1px solid var(--bdr);border-radius:var(--r);
  margin-top:.4rem;
}
table{width:100%;border-collapse:collapse;font-size:13px}

thead{position:sticky;z-index:70;background:var(--bg-3)}
th{
  padding:9px 12px;text-align:left;
  font-family:var(--fh);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--txt-2);
  border-bottom:1px solid var(--bdr);white-space:nowrap;
}
th.sth{text-align:center}

tr.pr{border-bottom:1px solid var(--bdr-2);transition:background .13s}
tr.pr:last-child{border:none}
tr.pr:hover{background:rgba(255,255,255,.018)}
tr.pr.hl{background:rgba(232,104,32,.09)}

td{padding:9px 12px;vertical-align:middle}

/* product name cell */
.pnc{min-width:155px;max-width:230px}
.pnc .nm{font-size:13px;line-height:1.3}
.ptags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ptag{
  font-family:var(--fm);font-size:9px;
  padding:1px 5px;border-radius:3px;
  background:var(--bg-3);color:var(--txt-3);border:1px solid var(--bdr-2);
}

/* store price cell */
.prc{text-align:center;min-width:88px}
.pm{font-family:var(--fm);font-size:13px;display:flex;align-items:center;justify-content:center;gap:3px}
.pw{font-family:var(--fm);font-size:10px;color:var(--txt-3);margin-top:2px}
.wbadge{background:rgba(245,158,11,.13);color:#f59e0b;border:1px solid rgba(245,158,11,.3);padding:0 4px;border-radius:2px;font-size:9px;margin-right:2px}
.nopr{color:var(--txt-3);font-size:11px}

/* indicators */
.ich{color:#fdd835;font-size:10px}
.iex{color:var(--txt-3);font-size:9px}

/* bar cell */
.brc{min-width:150px;padding:9px 14px}
.pbar{display:flex;gap:2px;height:4px;border-radius:2px;margin-bottom:4px}
.pbseg{border-radius:2px;flex:1;opacity:.75;transition:opacity .2s}
tr.pr:hover .pbseg{opacity:1}
.sinfo{font-family:var(--fm);font-size:10px;color:var(--txt-2)}
.sinfo .sv{color:#66bb6a}

mark{background:rgba(232,104,32,.32);color:inherit;border-radius:2px;padding:0 1px}

/* store colour classes */
.sc-bravo{color:var(--bravo)}.sc-oba{color:var(--oba)}.sc-araz{color:var(--araz)}.sc-neptun{color:var(--neptun)}.sc-rahat{color:var(--rahat)}
.sb-bravo{color:var(--bravo);border-color:var(--bravo);background:rgba(229,57,53,.1)}
.sb-oba{color:var(--oba);border-color:var(--oba);background:rgba(30,136,229,.1)}
.sb-araz{color:var(--araz);border-color:var(--araz);background:rgba(142,36,170,.1)}
.sb-neptun{color:var(--neptun);border-color:var(--neptun);background:rgba(67,160,71,.1)}
.sb-rahat{color:var(--rahat);border-color:var(--rahat);background:rgba(232,104,32,.1)}

/* empty */
.empty{text-align:center;padding:3.5rem 2rem;color:var(--txt-3)}
.empty .ei{font-size:2.5rem;margin-bottom:.75rem}

/* ===================== RESPONSIVE ===================== */
@media(max-width:1200px){.brc{display:none}}
@media(max-width:860px){
  .updated{display:none}
  .brc{display:none}
  .csinp{width:160px}
}
@media(max-width:600px){
  main{padding:0 1rem 2rem}
  .fp{margin:0 -1rem;padding:.5rem 1rem}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
  .hero{padding:1.5rem 0 1.2rem}
  .hdr{padding:0 1rem}
}
@media(max-width:380px){
  .logo b{display:none}
  .cgrid{grid-template-columns:1fr 1fr}
  .csinp{width:130px}
}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ======= HEADER ======= -->
<header>
  <div class="hdr">
    <span class="logo" onclick="goHome()">Qiymət<b>Müqayisə</b></span>
    <div class="gsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="gsi" type="text" placeholder="Bütün məhsullarda axtar…" autocomplete="off">
      <span class="g-hint">/</span>
      <div class="gdrop" id="gdrop"></div>
    </div>
    <div class="updated" id="updBadge"></div>
  </div>
</header>

<main>

<!-- ======= HOME ======= -->
<div id="vHome">
  <div class="hero">
    <h1>Bakı supermarketlərini <em>müqayisə et</em></h1>
    <p>Bravo · OBA · Araz · Neptun · Rahat — real vaxtda qiymət</p>
  </div>
  <div class="stats" id="statsPanel">
    <div class="sc"><div class="sc-lbl">Məhsul</div><div class="sc-val sk" style="height:1.55rem;width:54px;border-radius:4px"></div></div>
    <div class="sc"><div class="sc-lbl">Mağaza</div><div class="sc-val sk" style="height:1.55rem;width:36px;border-radius:4px"></div></div>
    <div class="sc"><div class="sc-lbl">Kateqoriya</div><div class="sc-val sk" style="height:1.55rem;width:36px;border-radius:4px"></div></div>
  </div>
  <div class="cgrid" id="cgrid">
    <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
    <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
    <div class="sk sk-card"></div><div class="sk sk-card"></div>
  </div>
</div>

<!-- ======= CATEGORY VIEW ======= -->
<div id="vCat">
  <div class="cat-hdr">
    <button class="back" onclick="goHome()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Geri
    </button>
    <h2 class="cat-title" id="catTitle"></h2>
  </div>
  <div class="sbadges" id="sbadges"></div>

  <!-- FILTER PANEL -->
  <div class="fp" id="filterPanel">
    <!-- Row 1: Type chips + search -->
    <div class="frow">
      <span class="flbl">Növ</span>
      <div id="typeChips" style="display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;align-items:center;"></div>
      <div class="cswrap" style="margin-left:auto;flex-shrink:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="csi" class="csinp" placeholder="Cədvəldə axtar…">
      </div>
    </div>
    <!-- Row 2: Weight mode + range + sort -->
    <div class="frow">
      <span class="flbl">Çəki</span>
      <button class="chip on" data-wm="all"     onclick="setWM(this)">Hamısı</button>
      <button class="chip"    data-wm="weight"  onclick="setWM(this)">⚖ Çəki</button>
      <button class="chip"    data-wm="volume"  onclick="setWM(this)">💧 Həcm</button>
      <button class="chip"    data-wm="other"   onclick="setWM(this)">📦 Digər</button>
      <input type="number" id="rMin" class="ri" placeholder="min" oninput="applyF()">
      <span style="color:var(--txt-3);font-size:10px;flex-shrink:0">—</span>
      <input type="number" id="rMax" class="ri" placeholder="max" oninput="applyF()">
      <span id="rUnit" style="font-size:10px;color:var(--txt-3);flex-shrink:0;min-width:16px"></span>
      <div style="margin-left:auto;display:flex;gap:5px;flex-shrink:0">
        <button class="schip on" data-s="default"   onclick="setSort(this)">Standart</button>
        <button class="schip"    data-s="az"         onclick="setSort(this)">A→Z</button>
        <button class="schip"    data-s="price-asc"  onclick="setSort(this)">Qiymət↑</button>
        <button class="schip"    data-s="save-desc"  onclick="setSort(this)">Qənaət↓</button>
      </div>
    </div>
    <!-- Row 3: Percentage (conditional) -->
    <div class="frow" id="pctRow">
      <span class="flbl">Faiz</span>
      <div id="pctChips" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;"></div>
    </div>
  </div>

  <!-- UNIT PRICE CARDS -->
  <div class="ucards" id="ucards"></div>

  <!-- TABLE -->
  <div class="twrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

</main>

<script>
/* ==================== CONFIG ==================== */
const STORES = ['Bravo','OBA','Araz','Neptun','Rahat'];
const SC = {Bravo:'bravo',OBA:'oba',Araz:'araz',Neptun:'neptun',Rahat:'rahat'};
const SCOL = {Bravo:'#e53935',OBA:'#1e88e5',Araz:'#8e24aa',Neptun:'#43a047',Rahat:'#e86820'};
const JAC_TH = 0.5;

const EMOJI = [
  ['sud','🥛'],['süd','🥛'],
  ['yumurta','🥚'],
  ['tereveez','🥦'],['tərəvəz','🥦'],['terevez','🥦'],
  ['meyvə','🍎'],['meyve','🍎'],
  ['etbalig','🥩'],['ət','🥩'],['balig','🐟'],
  ['taxil','🌾'],['paxlali','🌿'],
  ['corekpasta','🍞'],['corek','🍞'],['çörək','🍞'],
  ['ickiler','🥤'],['içkilər','🥤'],['icki','🥤'],
  ['sirniyyat','🍬'],['şirniyyat','🍬'],
  ['yag','🧈'],['sous','🧴'],
  ['edviyyat','🌶️'],['ədviyyat','🌶️'],
];

/* ==================== STATE ==================== */
let G = null;          // data
let curCat = null;
let matchedRows = [];
let F = {type:null,wm:'all',wMin:null,wMax:null,pct:null,q:''};
let sortM = 'default';

/* ==================== UTILS ==================== */
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function hl(text, q) {
  if (!q || !text) return esc(text||'');
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp(safe,'gi'), m => `<mark>${m}</mark>`);
}

function fp(p) {
  return typeof p === 'number' ? p.toFixed(2)+' ₼' : '—';
}

function tok(s) {
  return (s||'').toLowerCase()
    .replace(/[^\wəüöğşçıi\s]/gi,' ')
    .split(/\s+/).filter(t => t.length > 1);
}

function jaccard(a, b) {
  const sa = new Set(tok(a)), sb = new Set(tok(b));
  const inter = [...sa].filter(x => sb.has(x)).length;
  const union = new Set([...sa,...sb]).size;
  return union ? inter/union : 0;
}

function extractMeta(name) {
  const m = {weight:null,unit:null,mode:'other',pct:null};
  const wm = name.match(/(\d+(?:[.,]\d+)?)\s*(kq|kg|g|qr|ml|l|lt|litr)\b/i);
  if (wm) {
    const v = parseFloat(wm[1].replace(',','.')), u = wm[2].toLowerCase();
    if (u==='kg'||u==='kq') { m.weight=v*1000; m.unit='g'; m.mode='weight'; }
    else if (u==='g'||u==='qr') { m.weight=v; m.unit='g'; m.mode='weight'; }
    else if (u==='l'||u==='lt'||u==='litr') { m.weight=v*1000; m.unit='ml'; m.mode='volume'; }
    else if (u==='ml') { m.weight=v; m.unit='ml'; m.mode='volume'; }
  } else {
    const lm = name.match(/(\d+(?:[.,]\d+)?)\s*[Ll]\b/);
    if (lm) { m.weight=parseFloat(lm[1])*1000; m.unit='ml'; m.mode='volume'; }
  }
  const pm = name.match(/(\d+(?:[.,]\d+)?)\s*%/);
  if (pm) m.pct = parseFloat(pm[1].replace(',','.'));
  return m;
}

function catEmoji(id) {
  const key = id.toLowerCase().replace(/[^a-zəüöğşçıi]/g,'');
  for (const [k,v] of EMOJI) if (key.includes(k)||k.includes(key)) return v;
  return '🛒';
}

function weightLabel(meta) {
  if (!meta.weight) return null;
  if (meta.unit === 'ml') {
    return meta.weight >= 1000
      ? (meta.weight/1000).toFixed(meta.weight%1000===0?0:2).replace(/\.?0+$/,'')+'L'
      : meta.weight+'ml';
  }
  return meta.weight >= 1000
    ? (meta.weight/1000).toFixed(meta.weight%1000===0?0:2).replace(/\.?0+$/,'')+'kg'
    : meta.weight+'g';
}

/* ==================== MATCHING ==================== */
function matchProducts(catData) {
  const groups = [];
  for (const store of STORES) {
    const prods = catData.stores?.[store] || [];
    for (const prod of prods) {
      let found = false;
      for (const g of groups) {
        if (jaccard(g.name, prod.name) >= JAC_TH) {
          if (!g.stores[store]) g.stores[store] = prod;
          else if (prod.price < g.stores[store].price) g.stores[store] = prod; // keep cheaper
          found = true; break;
        }
      }
      if (!found) {
        const g = {name:prod.name, stores:{}, meta:extractMeta(prod.name), id:Math.random().toString(36).slice(2)};
        g.stores[store] = prod;
        groups.push(g);
      }
    }
  }
  return groups;
}

/* ==================== FILTERING ==================== */
function filteredRows() {
  const q = F.q.toLowerCase().trim();
  return matchedRows.filter(r => {
    if (q && !r.name.toLowerCase().includes(q)) return false;
    if (F.type === '__all__' || !F.type) {/* pass */}
    else if (F.type === '__other__') {
      if (F._topKeys && F._topKeys.has(tok(r.name)[0]||'')) return false;
    } else {
      if (!r.name.toLowerCase().includes(F.type)) return false;
    }
    if (F.wm !== 'all' && r.meta.mode !== F.wm) return false;
    if (F.wMin != null && r.meta.weight != null && r.meta.weight < F.wMin) return false;
    if (F.wMax != null && r.meta.weight != null && r.meta.weight > F.wMax) return false;
    if (F.pct != null && r.meta.pct !== F.pct) return false;
    return true;
  });
}

function sortedRows(rows) {
  if (sortM === 'az') return [...rows].sort((a,b) => a.name.localeCompare(b.name,'az'));
  if (sortM === 'price-asc') return [...rows].sort((a,b) => {
    const mA = Math.min(...Object.values(a.stores).map(s=>s.price).filter(isFinite));
    const mB = Math.min(...Object.values(b.stores).map(s=>s.price).filter(isFinite));
    return mA - mB;
  });
  if (sortM === 'save-desc') return [...rows].sort((a,b) => {
    const pA = Object.values(a.stores).map(s=>s.price).filter(isFinite);
    const pB = Object.values(b.stores).map(s=>s.price).filter(isFinite);
    return (Math.max(...pB)-Math.min(...pB)) - (Math.max(...pA)-Math.min(...pA));
  });
  return rows;
}

/* ==================== CATEGORY ==================== */
function openCat(catId) {
  curCat = catId;
  F = {type:null,wm:'all',wMin:null,wMax:null,pct:null,q:''};
  sortM = 'default';

  document.getElementById('vHome').style.display = 'none';
  document.getElementById('vCat').style.display = 'block';

  const cat = G.categories[catId];
  document.getElementById('catTitle').innerHTML = catEmoji(catId)+' '+esc(cat.name||catId);
  document.title = (cat.name||catId)+' — QiymətMüqayisə';

  matchedRows = matchProducts(cat);

  // reset UI controls
  document.getElementById('csi').value = '';
  document.getElementById('rMin').value = '';
  document.getElementById('rMax').value = '';
  document.getElementById('rUnit').textContent = '';
  document.querySelectorAll('.chip[data-wm]').forEach(c => c.classList.toggle('on', c.dataset.wm==='all'));
  document.querySelectorAll('.schip[data-s]').forEach(c => c.classList.toggle('on', c.dataset.s==='default'));

  buildTypeChips();
  buildPctChips();
  renderStoreCounters();
  renderUnitCards();
  renderTable();
  setStickyThead();

/* ---- type chips ---- */
function buildTypeChips() {
  const counts = {};
  matchedRows.forEach(r => {
    const t = tok(r.name)[0]||'digər';
    counts[t] = (counts[t]||0)+1;
  });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const top4 = sorted.slice(0,4);
  const topKeys = new Set(top4.map(([k])=>k));
  const hasOther = sorted.length > 4;

  const c = document.getElementById('typeChips');
  c.innerHTML = '';
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label;
    b.onclick = () => { c.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); fn(); applyF(); };
    return b;
  };
  const allBtn = mk('Hamısı', () => F.type = null);
  allBtn.classList.add('on');
  c.appendChild(allBtn);
  top4.forEach(([k,n]) => c.appendChild(mk(`${k} (${n})`, () => F.type = k)));
  if (hasOther) {
    const ob = mk('Digər', () => { F.type = '__other__'; F._topKeys = topKeys; });
    c.appendChild(ob);
  }
}

/* ---- pct chips ---- */
function buildPctChips() {
  const pcts = new Set();
  matchedRows.forEach(r => { if (r.meta.pct != null) pcts.add(r.meta.pct); });
  const pctRow = document.getElementById('pctRow');
  if (pcts.size <= 1) { pctRow.classList.remove('vis'); return; }
  pctRow.classList.add('vis');
  const c = document.getElementById('pctChips');
  c.innerHTML = '';
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label;
    b.onclick = () => { c.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); F.pct = val; applyF(); };
    return b;
  };
  const allB = mk('Hamısı', null); allB.classList.add('on'); c.appendChild(allB);
  [...pcts].sort((a,b)=>a-b).forEach(p => c.appendChild(mk(p+'%', p)));
}

/* ---- weight mode ---- */
function setWM(btn) {
  document.querySelectorAll('.chip[data-wm]').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  F.wm = btn.dataset.wm;
  const u = document.getElementById('rUnit');
  u.textContent = F.wm==='weight' ? 'g' : F.wm==='volume' ? 'ml' : '';
  applyF();
}

/* ---- sort ---- */
function setSort(btn) {
  document.querySelectorAll('.schip[data-s]').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  sortM = btn.dataset.s;
  applyF();
}

/* ---- apply filters ---- */
function applyF() {
  const minV = document.getElementById('rMin').value;
  const maxV = document.getElementById('rMax').value;
  F.wMin = minV !== '' ? parseFloat(minV) : null;
  F.wMax = maxV !== '' ? parseFloat(maxV) : null;
  F.q = document.getElementById('csi').value;
  renderTable();
}

/* ==================== STORE COUNTERS ==================== */
function renderStoreCounters() {
  const cat = G.categories[curCat];
  const cheapCnt = {}; STORES.forEach(s => cheapCnt[s]=0);
  matchedRows.forEach(r => {
    const ps = STORES.map(s => ({s, p: r.stores[s]?.price})).filter(x => isFinite(x.p));
    if (ps.length < 2) return;
    const min = Math.min(...ps.map(x=>x.p));
    ps.filter(x=>x.p===min).forEach(x=>cheapCnt[x.s]++);
  });
  const cont = document.getElementById('sbadges');
  cont.innerHTML = '';
  STORES.forEach(store => {
    const cnt = cat.stores?.[store]?.length || 0;
    if (!cnt) return;
    const b = document.createElement('span');
    b.className = `sbadge sb-${SC[store]}`;
    b.textContent = `${store}: ${cnt} · ★${cheapCnt[store]}`;
    cont.appendChild(b);
  });
}

/* ==================== UNIT CARDS ==================== */
function renderUnitCards() {
  const cont = document.getElementById('ucards');
  cont.innerHTML = '';
  const units = [
    {label:'100q başına', mode:'weight', base:100},
    {label:'100ml başına', mode:'volume', base:100},
    {label:'1kq başına',  mode:'weight', base:1000},
    {label:'1L başına',   mode:'volume', base:1000},
  ];
  units.forEach(u => {
    let best = null;
    matchedRows.forEach(r => {
      if (r.meta.mode !== u.mode || !r.meta.weight) return;
      STORES.forEach(store => {
        const prod = r.stores[store];
        if (!prod || !isFinite(prod.price)) return;
        const up = (prod.price / r.meta.weight) * u.base;
        if (!best || up < best.up) best = {up, name:r.name, store, price:prod.price};
      });
    });
    if (!best) return;
    const d = document.createElement('div');
    d.className = 'ucard';
    d.innerHTML = `<div class="uc-lbl">${u.label}</div>
      <div class="uc-price">${best.up.toFixed(2)} ₼</div>
      <div class="uc-name">${esc(best.name)}</div>
      <div class="uc-store sc-${SC[best.store]}">${best.store}</div>`;
    cont.appendChild(d);
  });
}

/* ==================== TABLE ==================== */
function renderTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const q = F.q.trim();

  thead.innerHTML = `<tr>
    <th>Məhsul</th>
    ${STORES.map(s=>`<th class="sth" style="color:${SCOL[s]}">${s}</th>`).join('')}
    <th class="brc">Müqayisə</th>
  </tr>`;

  const rows = sortedRows(filteredRows());

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${STORES.length+2}"><div class="empty"><div class="ei">🔍</div><p>Nəticə tapılmadı</p></div></td></tr>`;
    return;
  }

  const frag = document.createDocumentFragment();

  rows.forEach(row => {
    const prices = STORES.map(s=>row.stores[s]?.price).filter(isFinite);
    const minP = prices.length ? Math.min(...prices) : null;
    const maxP = prices.length ? Math.max(...prices) : null;
    const rng = maxP - minP;

    const tags = [];
    const wl = weightLabel(row.meta);
    if (wl) tags.push(`<span class="ptag">${wl}</span>`);
    if (row.meta.pct) tags.push(`<span class="ptag">${row.meta.pct}%</span>`);

    const storeCells = STORES.map(store => {
      const prod = row.stores[store];
      if (!prod) return `<td class="prc"><span class="nopr">—</span></td>`;
      const isCheap = isFinite(prod.price) && prod.price === minP && prices.length > 1;
      const isExp   = isFinite(prod.price) && prod.price === maxP && prices.length > 1;
      const ind = isCheap ? `<span class="ich" title="Ən ucuz">★</span>` : isExp ? `<span class="iex" title="Ən baha">●</span>` : '';
      const wolt = prod.wolt_price ? `<div class="pw"><span class="wbadge">w</span>${fp(prod.wolt_price)}</div>` : '';
      return `<td class="prc"><div class="pm">${ind}<span class="sc-${SC[store]}">${fp(prod.price)}</span></div>${wolt}</td>`;
    }).join('');

    // price bar segments (one per store that has price)
    const barSegs = STORES.filter(s=>isFinite(row.stores[s]?.price)).map(s => {
      const pct = rng > 0 ? (row.stores[s].price - minP) / rng : 0;
      return `<div class="pbseg" style="background:${SCOL[s]};opacity:${(.45+pct*.55).toFixed(2)}" title="${s}: ${fp(row.stores[s].price)}"></div>`;
    }).join('');

    let saveHtml = '';
    if (rng > 0.005) {
      const pct = ((rng/maxP)*100).toFixed(0);
      saveHtml = `<div class="sinfo">Qənaət: <span class="sv">${rng.toFixed(2)} ₼</span> (${pct}%)</div>`;
    }

    const tr = document.createElement('tr');
    tr.className = 'pr';
    tr.dataset.id = row.id;
    tr.innerHTML = `
      <td class="pnc"><div class="nm">${hl(row.name,q)}</div>${tags.length?`<div class="ptags">${tags.join('')}</div>`:''}</td>
      ${storeCells}
      <td class="brc"><div class="pbar">${barSegs}</div>${saveHtml}</td>
    `;
    frag.appendChild(tr);
  });
  tbody.innerHTML = '';
  tbody.appendChild(frag);
}

/* ---- sticky thead offset ---- */
function setStickyThead() {
  const fp = document.getElementById('filterPanel');
  const update = () => {
    const h = fp.getBoundingClientRect().height;
    document.getElementById('thead').style.top = (58 + h) + 'px';
  };
  update();
  const ro = new ResizeObserver(update);
  ro.observe(fp);
}

/* ==================== GLOBAL SEARCH ==================== */
function setupSearch() {
  const inp = document.getElementById('gsi');
  const drop = document.getElementById('gdrop');
  let t;

  inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(()=>doGSearch(inp.value), 200); });
  inp.addEventListener('keydown', e => {
    if (e.key==='Escape') { inp.value=''; drop.classList.remove('on'); inp.blur(); }
    if (e.key==='Enter') {
      const first = drop.querySelector('.gdr-item');
      if (first) first.click();
    }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.gsearch')) drop.classList.remove('on'); });

  // category search
  document.getElementById('csi').addEventListener('input', applyF);
}

function doGSearch(q) {
  const drop = document.getElementById('gdrop');
  if (!q || q.length < 2 || !G) { drop.classList.remove('on'); return; }
  const ql = q.toLowerCase();
  const hits = {};
  Object.entries(G.categories||{}).forEach(([catId,cat]) => {
    Object.entries(cat.stores||{}).forEach(([store,prods]) => {
      prods.forEach(prod => {
        if (!prod.name.toLowerCase().includes(ql)) return;
        const key = catId+'|||'+prod.name.toLowerCase();
        if (!hits[key] || prod.price < hits[key].price) hits[key] = {catId,catName:cat.name,store,prod,price:prod.price};
      });
    });
  });
  const items = Object.values(hits).sort((a,b)=>a.price-b.price).slice(0,14);
  if (!items.length) {
    drop.innerHTML = `<div class="gdr-empty">Nəticə tapılmadı</div>`;
    drop.classList.add('on'); return;
  }
  drop.innerHTML = items.map(r => `
    <div class="gdr-item" onclick="gotoResult('${esc(r.catId)}','${esc(r.prod.name)}')">
      <span class="gdr-cat">${esc(r.catName)}</span>
      <span class="gdr-name">${hl(r.prod.name,q)}</span>
      <span class="gdr-store" style="color:${SCOL[r.store]}">${r.store}</span>
      <span class="gdr-price">${fp(r.prod.price)}</span>
    </div>
  `).join('');
  drop.classList.add('on');
}

function gotoResult(catId, productName) {
  document.getElementById('gdrop').classList.remove('on');
  document.getElementById('gsi').value = '';
  openCat(catId);
  setTimeout(() => {
    const pnl = productName.toLowerCase().slice(0,30);
    document.querySelectorAll('#tbody tr.pr').forEach(tr => {
      if (tr.querySelector('.nm')?.textContent.toLowerCase().includes(pnl)) {
        tr.classList.add('hl');
        tr.scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  }, 250);
}

/* ==================== KEYBOARD ==================== */
function setupKeys() {
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (e.key==='/' && tag!=='INPUT' && tag!=='TEXTAREA') {
      e.preventDefault();
      document.getElementById('gsi').focus();
    }
    if (e.key==='Escape') {
      const drop = document.getElementById('gdrop');
      if (drop.classList.contains('on')) { drop.classList.remove('on'); return; }
      if (document.getElementById('gsi').value) { document.getElementById('gsi').value=''; return; }
      if (curCat) goHome();
    }
  });
}

function goHome() {
  curCat = null;
  document.getElementById('vCat').style.display = 'none';
  document.getElementById('vHome').style.display = 'block';
  document.title = 'QiymətMüqayisə';
}
