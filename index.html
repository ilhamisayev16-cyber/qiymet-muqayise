<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QiymətMüqayisə</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0906;
  --card:#15110d;
  --card2:#1d1712;
  --accent:#e86820;
  --text:#f4f4f4;
  --muted:#9b8f84;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Outfit,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{max-width:1200px;margin:auto;padding:20px;}

.logo{font-size:32px;font-weight:700;}
.logo span{color:var(--accent);}

.search-box input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:none;
  background:var(--card);
  color:white;
  margin-top:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.stat{
  background:var(--card);
  padding:15px;
  border-radius:12px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
  margin-top:25px;
}

.category{
  background:linear-gradient(180deg,var(--card),var(--card2));
  padding:18px;
  border-radius:15px;
  cursor:pointer;
}

.hidden{display:none;}

.toolbar{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.btn{
  padding:8px 12px;
  background:var(--card);
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.btn.active{background:var(--accent);}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.cheapest{color:#22c55e;font-weight:700;}

.store-badge{
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.bravo{background:#ef4444;}
.oba{background:#0ea5e9;}
.araz{background:#a855f7;}
.neptun{background:#10b981;}
.rahat{background:#f59e0b;}
</style>
</head>

<body>

<div class="container">

<div class="logo">Qiymət<span>Müqayisə</span></div>

<div class="search-box">
<input id="search" placeholder="Axtar..." />
</div>

<div class="stats">
  <div class="stat"><h4>Məhsul</h4><strong id="total">0</strong></div>
  <div class="stat"><h4>Mağaza</h4><strong>5</strong></div>
  <div class="stat"><h4>Kateqoriya</h4><strong>5</strong></div>
  <div class="stat"><h4>Qənaət</h4><strong id="saving">0 ₼</strong></div>
</div>

<!-- HOME -->
<div id="home">

<div class="categories">

<div class="category" data-cat="sud">🥛 Süd</div>
<div class="category" data-cat="yumurta">🥚 Yumurta</div>
<div class="category" data-cat="terevez">🥦 Tərəvəz</div>
<div class="category" data-cat="meyve">🍎 Meyvə</div>
<div class="category" data-cat="et">🥩 Ət</div>

</div>

</div>

<!-- CATEGORY -->
<div id="catView" class="hidden">

<button class="btn" id="back">← Geri</button>

<h2 id="title"></h2>

<div class="toolbar">

<button class="btn active" data-sort="saving">Qənaət</button>
<button class="btn" data-sort="price">Qiymət</button>
<button class="btn" data-sort="az">A-Z</button>
<button class="btn" id="stockBtn">Stock</button>

</div>

<div style="overflow:auto;">
<table>
<thead>
<tr>
<th>Məhsul</th>
<th>Ucuz mağaza</th>
<th>Qiymət</th>
<th>Qənaət</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

</div>

<script>

// ================= DATA =================
const prices = {
  sud: [
    {name:"Milla Süd 1L",stores:{bravo:{price:1.89,stock:true},oba:{price:1.75,stock:true},araz:{price:1.80,stock:true},neptun:{price:1.92,stock:true},rahat:{price:1.85,stock:false}}},
    {name:"Süd 0.5L",stores:{bravo:{price:1.10,stock:true},oba:{price:1.05,stock:true},araz:{price:1.08,stock:true},neptun:{price:1.15,stock:true},rahat:{price:1.12,stock:true}}}
  ],
  yumurta: [
    {name:"Yumurta 10 ədəd",stores:{bravo:{price:2.8,stock:true},oba:{price:2.6,stock:true},araz:{price:2.75,stock:true},neptun:{price:2.9,stock:true},rahat:{price:2.85,stock:true}}}
  ],
  terevez: [
    {name:"Pomidor 1kg",stores:{bravo:{price:2.4,stock:true},oba:{price:2.1,stock:true},araz:{price:2.3,stock:true},neptun:{price:2.5,stock:true},rahat:{price:2.35,stock:true}}}
  ],
  meyve: [
    {name:"Alma 1kg",stores:{bravo:{price:2.1,stock:true},oba:{price:1.95,stock:true},araz:{price:2.0,stock:true},neptun:{price:2.2,stock:true},rahat:{price:2.05,stock:true}}}
  ],
  et: [
    {name:"Toyuq filesi",stores:{bravo:{price:7.9,stock:true},oba:{price:7.5,stock:true},araz:{price:7.8,stock:true},neptun:{price:8.1,stock:true},rahat:{price:7.7,stock:true}}}
  ]
};

// ================= STATE =================
let currentCat = null;
let sortType = "saving";
let onlyStock = false;

// ================= HELPERS =================
function cheapest(store){
  let minStore="",min=999999;
  for(let k in store){
    if(store[k].stock && store[k].price<min){
      min=store[k].price;
      minStore=k;
    }
  }
  return {minStore,min};
}

function saving(item){
  const arr = Object.values(item.stores).map(s=>s.price);
  return Math.max(...arr)-Math.min(...arr);
}

function sortData(data){
  let d=[...data];

  if(sortType==="saving"){
    d.sort((a,b)=>saving(b)-saving(a));
  }

  if(sortType==="price"){
    d.sort((a,b)=>cheapest(a.stores).min-cheapest(b.stores).min);
  }

  if(sortType==="az"){
    d.sort((a,b)=>a.name.localeCompare(b.name));
  }

  return d;
}

// ================= RENDER =================
function render(cat){

  let data = prices[cat];

  if(onlyStock){
    data = data.filter(i =>
      Object.values(i.stores).some(s=>s.stock)
    );
  }

  data = sortData(data);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  let best=0;

  data.forEach(i=>{
    const c = cheapest(i.stores);
    const s = saving(i);
    best=Math.max(best,s);

    tbody.innerHTML+=`
      <tr>
        <td>${i.name}</td>
        <td><span class="store-badge ${c.minStore}">${c.minStore.toUpperCase()}</span></td>
        <td>${c.min.toFixed(2)} ₼</td>
        <td class="cheapest">-${s.toFixed(2)} ₼</td>
      </tr>
    `;
  });

  document.getElementById("saving").innerText=best.toFixed(2)+" ₼";
  document.getElementById("total").innerText=data.length;
}

// ================= EVENTS =================

// category open
document.querySelectorAll(".category").forEach(c=>{
  c.onclick=()=>{
    currentCat=c.dataset.cat;
    document.getElementById("home").classList.add("hidden");
    document.getElementById("catView").classList.remove("hidden");
    document.getElementById("title").innerText=c.innerText;
    render(currentCat);
  };
});

// back
document.getElementById("back").onclick=()=>{
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("catView").classList.add("hidden");
};

// sort buttons
document.querySelectorAll("[data-sort]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("[data-sort]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    sortType=b.dataset.sort;
    render(currentCat);
  };
});

// stock filter
document.getElementById("stockBtn").onclick=()=>{
  onlyStock=!onlyStock;
  document.getElementById("stockBtn").classList.toggle("active");
  render(currentCat);
};

// search
document.getElementById("search").oninput=(e)=>{
  const val=e.target.value.toLowerCase();
  if(!currentCat) return;

  const filtered = prices[currentCat].filter(i=>
    i.name.toLowerCase().includes(val)
  );

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  filtered.forEach(i=>{
    const c=cheapest(i.stores);
    const s=saving(i);

    tbody.innerHTML+=`
      <tr>
        <td>${i.name}</td>
        <td><span class="store-badge ${c.minStore}">${c.minStore.toUpperCase()}</span></td>
        <td>${c.min.toFixed(2)} ₼</td>
        <td class="cheapest">-${s.toFixed(2)} ₼</td>
      </tr>
    `;
  });
};

</script>

</body>
</html>
