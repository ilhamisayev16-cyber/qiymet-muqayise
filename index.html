<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QiymətMüqayisə — Azərbaycan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0e1117;
  --bg2: #161b27;
  --bg3: #1e2535;
  --border: #2a3248;
  --text: #e8eaf2;
  --muted: #7a85a3;
  --accent: #f0a500;
  --accent2: #2fb8ac;
  --bravo: #e63946;
  --oba: #3a86ff;
  --araz: #8338ec;
  --neptun: #06d6a0;
  --rahat: #fb5607;
  --wolt: #009de0;
  --cheap: #22c55e;
  --r: 10px;
  --r2: 6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
}

/* ── HEADER ──────────────────────────────────── */
header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.logo{
  font-size:18px;font-weight:700;letter-spacing:-0.5px;
  color:var(--accent);flex:1;min-width:140px;
}
.logo span{color:var(--text);font-weight:400;}
#last-updated{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
#back-btn{
  display:none;
  align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:7px 14px;border-radius:var(--r2);
  cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;
  transition:background .15s;
}
#back-btn:hover{background:var(--border);}
#back-btn svg{width:14px;height:14px;}

/* ── SEARCH BAR ──────────────────────────────── */
.search-wrap{
  padding:16px 20px 8px;
  display:none;
}
.search-wrap.visible{display:block;}
#search-input{
  width:100%;background:var(--bg2);border:1px solid var(--border);
  color:var(--text);padding:10px 14px;border-radius:var(--r);
  font-size:14px;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color .15s;
}
#search-input:focus{border-color:var(--accent2);}
#search-input::placeholder{color:var(--muted);}

/* ── SORT BAR ──────────────────────────────── */
.sort-bar{
  padding:8px 20px;
  display:none;align-items:center;gap:8px;flex-wrap:wrap;
}
.sort-bar.visible{display:flex;}
.sort-bar span{font-size:12px;color:var(--muted);}
.sort-btn{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--muted);padding:5px 12px;border-radius:20px;
  cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;
  transition:all .15s;
}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}
.sort-btn:hover:not(.active){border-color:var(--accent2);color:var(--text);}

/* ── CATEGORY GRID ───────────────────────────── */
#home-view{padding:20px;}
.section-title{
  font-size:12px;font-weight:600;letter-spacing:1.5px;
  color:var(--muted);text-transform:uppercase;margin-bottom:14px;
}
.cat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.cat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px 14px;
  cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
}
.cat-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:0;transition:opacity .18s;
}
.cat-card:hover{background:var(--bg3);border-color:var(--accent);transform:translateY(-1px);}
.cat-card:hover::before{opacity:1;}
.cat-card:active{transform:translateY(0);transition:none;}
.cat-icon{font-size:24px;}
.cat-name{font-size:13px;font-weight:600;color:var(--text);}
.cat-count{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.cat-stores{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;}
.dot{
  width:7px;height:7px;border-radius:50%;
}

/* ── CATEGORY VIEW ───────────────────────────── */
#cat-view{display:none;padding:0 0 40px;}
#cat-header{
  padding:20px 20px 12px;
  display:flex;align-items:center;gap:10px;
}
.cat-view-icon{font-size:28px;}
#cat-title{font-size:20px;font-weight:700;}
#cat-subtitle{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace;}

/* ── PRODUCT TABLE ───────────────────────────── */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 20px;}
table{
  width:100%;border-collapse:collapse;
  min-width:500px;
  font-size:13px;
}
thead th{
  background:var(--bg3);padding:10px 12px;text-align:left;
  font-size:11px;font-weight:600;letter-spacing:0.8px;
  color:var(--muted);text-transform:uppercase;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
thead th:first-child{border-radius:var(--r2) 0 0 0;}
thead th:last-child{border-radius:0 var(--r2) 0 0;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--bg2);}
tbody tr:last-child{border-bottom:none;}
td{padding:10px 12px;vertical-align:top;}
.td-name{
  font-size:13px;font-weight:500;color:var(--text);
  max-width:200px;line-height:1.4;
}
.price-cell{white-space:nowrap;}
.price-own{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'DM Mono',monospace;font-size:13px;font-weight:500;
}
.price-own.cheapest{
  color:var(--cheap);font-weight:700;
}
.price-own.cheapest::after{
  content:'↓';font-size:10px;
}
.wolt-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:rgba(0,157,224,.12);border:1px solid rgba(0,157,224,.25);
  color:var(--wolt);border-radius:4px;
  padding:2px 6px;font-size:11px;font-family:'DM Mono',monospace;
  margin-top:3px;
}
.wolt-badge.cheaper{
  background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.25);
  color:var(--cheap);
}
.wolt-badge.pricier{
  background:rgba(240,165,0,.08);border-color:rgba(240,165,0,.2);
  color:var(--accent);
}
.wolt-only{
  font-family:'DM Mono',monospace;font-size:12px;
  color:var(--wolt);opacity:.8;
}
.dash{color:var(--border);font-size:18px;}
.store-header{display:flex;align-items:center;gap:6px;}
.store-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* loading */
#loading{
  display:none;text-align:center;padding:60px 20px;
  color:var(--muted);font-size:14px;
}
#loading.visible{display:block;}
.spinner{
  width:32px;height:32px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}

/* store legend */
.legend{
  display:flex;gap:16px;flex-wrap:wrap;
  padding:8px 20px 16px;
}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-size:11px;color:var(--muted);
}

/* ── MOBILE ──────────────────────────────────── */
@media(max-width:600px){
  .logo{font-size:15px;}
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .cat-card{padding:12px 10px;gap:6px;}
  .cat-icon{font-size:20px;}
  .cat-name{font-size:12px;}
  .cat-count{font-size:10px;}
  #cat-title{font-size:17px;}
  thead th{font-size:10px;padding:8px 8px;}
  td{padding:8px 8px;}
  .td-name{font-size:12px;max-width:120px;}
  .price-own{font-size:12px;}
  .wolt-badge{font-size:10px;}
  .table-scroll{padding:0 12px;}
  #home-view{padding:16px 12px;}
  .search-wrap{padding:12px 12px 6px;}
  .sort-bar{padding:6px 12px;}
  #cat-header{padding:16px 12px 10px;}
  .legend{padding:6px 12px 12px;gap:10px;}
}
@media(max-width:380px){
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  #back-btn{font-size:12px;padding:6px 10px;}
}
</style>
</head>
<body>

<header>
  <button id="back-btn" onclick="showHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Geri
  </button>
  <div class="logo">Qiymət<span>Müqayisə</span></div>
  <div id="last-updated"></div>
</header>

<!-- HOME: category grid -->
<div id="home-view">
  <div class="section-title">Kateqoriyalar</div>
  <div id="loading" class="visible">
    <div class="spinner"></div>
    Məlumatlar yüklənir…
  </div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- CATEGORY VIEW -->
<div id="cat-view">
  <div id="cat-header">
    <div class="cat-view-icon" id="cat-icon-big"></div>
    <div>
      <div id="cat-title"></div>
      <div id="cat-subtitle"></div>
    </div>
  </div>
  <div class="legend" id="store-legend"></div>
  <div class="search-wrap visible">
    <input type="search" id="search-input" placeholder="Məhsul axtar…" oninput="filterTable()"/>
  </div>
  <div class="sort-bar visible" id="sort-bar">
    <span>Sırala:</span>
    <button class="sort-btn active" onclick="setSort('name')">Ad</button>
    <button class="sort-btn" onclick="setSort('price_asc')">Qiymət ↑</button>
    <button class="sort-btn" onclick="setSort('price_desc')">Qiymət ↓</button>
  </div>
  <div class="table-scroll">
    <table id="product-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="no-results" style="display:none">Məhsul tapılmadı</div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const STORE_COLORS = {
  Bravo:"#e63946", OBA:"#3a86ff", Araz:"#8338ec",
  Neptun:"#06d6a0", Rahat:"#fb5607"
};
const CAT_ICONS = {
  sud:"🥛",yumurta:"🥚",kere_yagi:"🧈",pendir:"🧀",qatiq:"🫙",
  xama:"🥄",kefir:"🥛",ayran:"🥤",
  kartof:"🥔",pomidor:"🍅",xiyar:"🥒",soyan:"🧅",kelem:"🥬",
  yerkoyu:"🥕",cuqundur:"🫚",qabaq:"🥜",badimcan:"🍆",
  biber:"🌶️",sarimsaq:"🧄",ispanaq:"🌿",
  alma:"🍎",armud:"🍐",saftal:"🍑",gilas:"🍒",
  uzum:"🍇",banan:"🍌",kivi:"🥝",limon:"🍋",portaqal:"🍊",nar:"🍎",
  toyuq:"🍗",dana_ati:"🥩",qoyun_ati:"🍖",hindi:"🦃",
  kolbasa:"🌭",sosis:"🌭",baliq:"🐟",
  duyu:"🍚",merci:"🫘",noxud:"🟡",fasulya:"🫘",
  qarabashaq:"🌾",yulaf:"🌾",un:"🌾",makaron:"🍝",
  corek:"🍞",pecenye:"🍪",
  cay:"🍵",qehve:"☕",sire:"🧃",su:"💧",kola:"🥤",
  energetik:"⚡",sokolad:"🍫",halva:"🍬",bal:"🍯",dondurma:"🍦",
  zeytun_yagi:"🫒",ay_cicayi:"🌻",mayonez:"🫙",
  ketcup:"🍅",xardal:"🟡",duz:"🧂",sekerqum:"🍬",istiot:"🌶️",
};

// ── State ───────────────────────────────────────────────────────────────────
let DATA = null;
let STORES = [];
let currentCat = null;
let sortMode = 'name';
let allRows = [];

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('data/prices.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    DATA = await r.json();
    STORES = DATA.stores || ["Bravo","OBA","Araz","Neptun","Rahat"];
    document.getElementById('last-updated').textContent =
      DATA.last_updated ? `Yeniləndi: ${DATA.last_updated}` : '';
    buildGrid();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#e63946">❌ data/prices.json yüklənmədi.<br>
       <small style="opacity:.6">python -m http.server 8000 işlədiyindən əmin ol</small></div>`;
  }
}

// ── Category grid ────────────────────────────────────────────────────────────
function buildGrid() {
  const loading = document.getElementById('loading');
  const grid = document.getElementById('cat-grid');
  loading.classList.remove('visible');
  loading.style.display = 'none';

  const cats = DATA.categories;
  let html = '';
  for (const [id, cat] of Object.entries(cats)) {
    const total = Object.values(cat.stores || {})
      .reduce((s,arr)=>s+arr.length, 0);
    if (!total) continue;

    // Which stores have data?
    const activeDots = STORES
      .filter(s => cat.stores && cat.stores[s] && cat.stores[s].length > 0)
      .map(s => `<div class="dot" style="background:${STORE_COLORS[s]||'#888'}" title="${s}"></div>`)
      .join('');

    const icon = CAT_ICONS[id] || '📦';
    html += `<div class="cat-card" onclick="openCat('${id}')">
      <div class="cat-icon">${icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-count">${total} məhsul</div>
      <div class="cat-stores">${activeDots}</div>
    </div>`;
  }
  grid.innerHTML = html || '<div class="empty">Məlumat tapılmadı</div>';
}

// ── Open category ─────────────────────────────────────────────────────────
function openCat(catId) {
  currentCat = catId;
  sortMode = 'name';
  document.querySelectorAll('.sort-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('search-input').value = '';

  const cat = DATA.categories[catId];
  const icon = CAT_ICONS[catId] || '📦';

  document.getElementById('cat-icon-big').textContent = icon;
  document.getElementById('cat-title').textContent = cat.name;

  // Legend
  const legend = document.getElementById('store-legend');
  legend.innerHTML = STORES.map(s => {
    const cnt = cat.stores && cat.stores[s] ? cat.stores[s].length : 0;
    return `<div class="legend-item">
      <div style="width:10px;height:10px;border-radius:50%;background:${STORE_COLORS[s]||'#888'}"></div>
      <span>${s} (${cnt})</span>
    </div>`;
  }).join('') + `<div class="legend-item">
    <div style="width:10px;height:10px;border-radius:50%;background:#009de0"></div>
    <span>W = Wolt qiyməti</span>
  </div>`;

  // Build table
  buildTable(catId);

  // Toggle views
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('cat-view').style.display = 'block';
  document.getElementById('back-btn').style.display = 'flex';
  window.scrollTo(0,0);
}

// ── Build table ──────────────────────────────────────────────────────────────
function similarity(a, b) {
  const wa = new Set(a.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  const wb = new Set(b.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  let inter = 0;
  wa.forEach(w => { if(wb.has(w)) inter++; });
  return inter / Math.max(wa.size, wb.size, 1);
}

function buildTable(catId) {
  const cat = DATA.categories[catId];
  const head = document.getElementById('table-head');
  const body = document.getElementById('table-body');

  // Header
  let thHtml = '<tr><th>Məhsul</th>';
  STORES.forEach(s => {
    const c = STORE_COLORS[s] || '#888';
    thHtml += `<th><div class="store-header">
      <div class="store-dot" style="background:${c}"></div>${s}
    </div></th>`;
  });
  thHtml += '</tr>';
  head.innerHTML = thHtml;

  // Collect all unique products across all stores
  const storeItems = {};
  STORES.forEach(s => {
    storeItems[s] = (cat.stores && cat.stores[s]) ? [...cat.stores[s]] : [];
  });

  // Build unified product list
  const unified = [];
  const usedPerStore = {};
  STORES.forEach(s => usedPerStore[s] = new Set());

  // Start with the store that has most items
  const anchor = STORES.slice().sort((a,b)=>
    storeItems[b].length - storeItems[a].length)[0];

  storeItems[anchor].forEach((item, idx) => {
    const row = { name: item.name, prices: {} };
    row.prices[anchor] = { own: item.price, wolt: item.wolt_price };
    usedPerStore[anchor].add(idx);

    // Match to other stores
    STORES.filter(s => s !== anchor).forEach(s => {
      let bestSim = 0, bestIdx = -1;
      storeItems[s].forEach((si, i) => {
        if(usedPerStore[s].has(i)) return;
        const sim = similarity(item.name, si.name);
        if(sim > bestSim){ bestSim = sim; bestIdx = i; }
      });
      if(bestSim >= 0.5 && bestIdx >= 0){
        const si = storeItems[s][bestIdx];
        row.prices[s] = { own: si.price, wolt: si.wolt_price };
        usedPerStore[s].add(bestIdx);
      }
    });
    unified.push(row);
  });

  // Add unmatched items from other stores
  STORES.filter(s => s !== anchor).forEach(s => {
    storeItems[s].forEach((item, idx) => {
      if(usedPerStore[s].has(idx)) return;
      const row = { name: item.name, prices: {} };
      row.prices[s] = { own: item.price, wolt: item.wolt_price };
      unified.push(row);
    });
  });

  allRows = unified;
  renderRows(sortAndFilter());

  const total = unified.length;
  document.getElementById('cat-subtitle').textContent =
    `${total} məhsul • ${STORES.filter(s=>storeItems[s].length>0).join(', ')}`;
}

function sortAndFilter() {
  const q = (document.getElementById('search-input').value||'').toLowerCase().trim();
  let rows = q
    ? allRows.filter(r => r.name.toLowerCase().includes(q))
    : [...allRows];

  if(sortMode === 'name') {
    rows.sort((a,b) => a.name.localeCompare(b.name,'az'));
  } else {
    rows.sort((a,b) => {
      const pa = minPrice(a), pb = minPrice(b);
      if(pa === null && pb === null) return 0;
      if(pa === null) return 1;
      if(pb === null) return -1;
      return sortMode === 'price_asc' ? pa - pb : pb - pa;
    });
  }
  return rows;
}

function minPrice(row) {
  let min = null;
  STORES.forEach(s => {
    const p = row.prices[s];
    if(!p) return;
    const v = p.own ?? p.wolt;
    if(v !== undefined && v !== null && (min === null || v < min)) min = v;
  });
  return min;
}

function renderRows(rows) {
  const body = document.getElementById('table-body');
  const noRes = document.getElementById('no-results');

  if(!rows.length){
    body.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  // Find cheapest store for each row
  let html = '';
  rows.forEach(row => {
    let cheapestStore = null, cheapestPrice = null;
    STORES.forEach(s => {
      const p = row.prices[s];
      if(!p) return;
      const v = p.own ?? null;
      if(v !== null && (cheapestPrice === null || v < cheapestPrice)){
        cheapestPrice = v; cheapestStore = s;
      }
    });

    let cells = `<td class="td-name">${esc(row.name)}</td>`;
    STORES.forEach(s => {
      const p = row.prices[s];
      if(!p){
        cells += `<td class="price-cell"><span class="dash">—</span></td>`;
        return;
      }

      let inner = '';
      if(p.own !== undefined && p.own !== null){
        const isCheap = (s === cheapestStore);
        inner += `<div class="price-own${isCheap?' cheapest':''}">₼${fmt(p.own)}</div>`;
      }
      if(p.wolt !== undefined && p.wolt !== null){
        const diff = p.own !== undefined && p.own !== null ? p.wolt - p.own : 0;
        const cls = diff < -0.01 ? 'wolt-badge cheaper'
                  : diff > 0.01  ? 'wolt-badge pricier'
                  : 'wolt-badge';
        inner += `<div class="${cls}">W ₼${fmt(p.wolt)}</div>`;
      }
      if(!inner){
        inner = `<span class="dash">—</span>`;
      }
      cells += `<td class="price-cell">${inner}</td>`;
    });
    html += `<tr>${cells}</tr>`;
  });
  body.innerHTML = html;
}

function filterTable(){
  renderRows(sortAndFilter());
}

function setSort(mode){
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(mode));
  });
  renderRows(sortAndFilter());
}

function showHome(){
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('cat-view').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';
  window.scrollTo(0,0);
}

function fmt(n){ return n !== null && n !== undefined ? Number(n).toFixed(2) : '—'; }
function esc(s){ 
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
