<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QİYMƏTMÜQAYİSƏ — Azərbaycan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono','Courier New',monospace;background:#f5f0e8;color:#1a1a1a;min-height:100vh}
header{background:#1a1a1a;color:#f5f0e8;padding:24px 32px;border-bottom:4px solid #d4a853}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px}
h1 span{color:#d4a853}
.subtitle{margin-top:4px;font-size:11px;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
.last-update{text-align:right;font-size:11px;opacity:.5}
.last-update b{color:#d4a853;opacity:1;display:block}
.main{max-width:1100px;margin:0 auto;padding:24px 32px}
input{width:100%;padding:10px 16px;border:2px solid #1a1a1a;background:white;font-family:inherit;font-size:14px;outline:none;margin-bottom:20px}
.category-title{background:#1a1a1a;color:#f5f0e8;padding:10px 20px;font-size:13px;letter-spacing:.1em;margin-bottom:2px}
.table-wrap{overflow-x:auto;border:2px solid #1a1a1a;margin-bottom:32px}
table{width:100%;border-collapse:collapse;background:white}
thead tr{background:#1a1a1a;color:#f5f0e8}
th{padding:12px 16px;text-align:left;font-size:11px;letter-spacing:.08em;font-weight:500;white-space:nowrap}
th.right{text-align:right}
td{padding:10px 16px;border-bottom:1px solid #e8e0d0;font-size:13px}
td.right{text-align:right;font-weight:700;color:#b8860b}
tr.even{background:#fafafa}
tr.odd{background:white}
.store-tag{display:inline-block;padding:2px 8px;font-size:11px;border-radius:2px;color:white;margin-right:4px}
.footer{margin-top:16px;padding:16px 0;border-top:2px solid #ddd;font-size:11px;color:#999;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>🛒 QİYMƏT<span>MÜQAYİSƏ</span></h1>
      <p class="subtitle">Azərbaycan ərzaq qiymətləri müqayisəsi</p>
    </div>
    <div class="last-update">📡 Son yenilənmə<b id="lastUpdate">yüklənir...</b></div>
  </div>
</header>
<div class="main">
  <input id="search" type="text" placeholder="Məhsul axtar..." oninput="render()"/>
  <div id="content"></div>
  <div class="footer">
    <span>Qiymətlər Azərbaycan Manatı (₼) ilə · Hər gün avtomatik yenilənir</span>
    <span>Bravo · Neptun · Rahat · OBA</span>
  </div>
</div>
<script>
const COLORS={"Bravo":"#e63946","Neptun":"#6366f1","Rahat":"#2a9d8f","OBA":"#f4a261"};
let allData=null;

fetch("./data/prices.json")
  .then(r=>r.json())
  .then(data=>{
    allData=data;
    document.getElementById("lastUpdate").textContent=data.last_updated;
    render();
  })
  .catch(()=>{
    document.getElementById("content").innerHTML='<p style="padding:40px;color:#999;text-align:center">❌ Qiymətlər yüklənə bilmədi.</p>';
  });

function render(){
  if(!allData) return;
  const search=document.getElementById("search").value.toLowerCase();
  const stores=allData.stores;
  const storeNames=Object.keys(stores);

  // Collect all unique products across all stores
  let allItems=[];
  storeNames.forEach(store=>{
    (stores[store]||[]).forEach(item=>{
      if(item.name.toLowerCase().includes(search)){
        allItems.push({...item, store});
      }
    });
  });

  if(!allItems.length){
    document.getElementById("content").innerHTML='<p style="padding:40px;color:#999;text-align:center">Heç nə tapılmadı</p>';
    return;
  }

  // Sort by price
  allItems.sort((a,b)=>a.price-b.price);

  let html=`<div class="category-title">🥛 ${allData.category} — ${allItems.length} məhsul tapıldı</div>`;
  html+=`<div class="table-wrap"><table>
    <thead><tr>
      <th>MƏHSUL ADI</th>
      <th>MAĞAZA</th>
      <th class="right">QİYMƏT</th>
    </tr></thead><tbody>`;

  allItems.forEach((item,i)=>{
    const color=COLORS[item.store]||"#888";
    html+=`<tr class="${i%2===0?'even':'odd'}">
      <td>${item.name}</td>
      <td><span class="store-tag" style="background:${color}">${item.store}</span></td>
      <td class="right">₼${item.price.toFixed(2)}</td>
    </tr>`;
  });

  html+=`</tbody></table></div>`;
  document.getElementById("content").innerHTML=html;
}
</script>
</body>
</html>
