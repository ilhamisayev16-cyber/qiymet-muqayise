<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QiymətMüqayisə</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f4ef; --bg2:#fff; --bg3:#f0ece4; --border:#e2dbd0;
  --text:#1a1612; --muted:#9a9088; --accent:#c8410b; --ink:#2d2620;
  --cheap-c:#16a34a; --cheap-bg:#f0fdf4; --cheap-border:#bbf7d0;
  --exp-c:#dc2626; --exp-bg:#fff5f5; --exp-border:#fecaca;
  --wolt-c:#64b5d4;
  --r:10px; --r2:6px;
  --filter-h:44px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
header{
  background:var(--ink);padding:11px 18px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:10px;
}
.logo{flex:1;font-size:17px;font-weight:800;color:#fff;}
.logo em{color:var(--accent);font-style:normal;}
#last-upd{font-size:10px;font-family:'Space Mono',monospace;color:rgba(255,255,255,.28);}
#back-btn{
  display:none;align-items:center;gap:5px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
  color:#fff;padding:6px 12px;border-radius:var(--r2);
  cursor:pointer;font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;
}
#back-btn svg{width:12px;height:12px;}

/* ── HOME ── */
#home-view{padding:16px;}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;}
.cat-card{
  background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r);
  padding:13px 12px 11px;cursor:pointer;transition:all .16s;
  display:flex;flex-direction:column;gap:5px;
}
.cat-card:hover{border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 3px 14px rgba(200,65,11,.1);}
.cat-icon{font-size:22px;line-height:1;}
.cat-name{font-size:12px;font-weight:700;line-height:1.2;}
.cat-meta{display:flex;align-items:center;justify-content:space-between;}
.cat-cnt{font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;}
.cat-dots{display:flex;gap:3px;}
.sdot{width:6px;height:6px;border-radius:50%;}

#loading{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;}
.spinner{width:26px;height:26px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── CATEGORY VIEW ── */
#cat-view{display:none;}
.cat-top{
  background:var(--ink);padding:14px 18px 12px;
  display:flex;align-items:center;gap:10px;
}
#cat-icon{font-size:26px;flex-shrink:0;}
#cat-title{font-size:17px;font-weight:800;color:#fff;}
#cat-sub{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px;
  font-family:'Space Mono',monospace;}

/* ── UNIT CARDS ── */
.unit-section{
  padding:11px 18px 13px;
  background:var(--bg3);border-bottom:1px solid var(--border);
}
.unit-sec-label{
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--muted);text-transform:uppercase;margin-bottom:8px;
}
.unit-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.unit-card{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r2);padding:9px 10px;
}
.unit-card.has-data{border-color:var(--cheap-border);}
.unit-card-heading{
  font-size:9px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;
}
.unit-card-price{
  font-family:'Space Mono',monospace;font-size:15px;font-weight:700;
  color:var(--cheap-c);line-height:1;
}
.unit-card-name{
  font-size:10px;font-weight:600;color:var(--text);
  margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.unit-card-store{
  display:flex;align-items:center;gap:3px;margin-top:2px;
}
.unit-card-dot{width:5px;height:5px;border-radius:50%;}
.unit-card-store-name{font-size:9px;color:var(--muted);}
.unit-card-empty{font-size:12px;color:var(--border);padding:4px 0;}

/* ── TOOLBAR ── */
.toolbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:9px 18px;display:flex;align-items:center;gap:7px;
  position:sticky;top:44px;z-index:100;
}
#srch{
  flex:1;background:var(--bg3);border:1.5px solid var(--border);
  color:var(--text);padding:6px 10px;border-radius:var(--r2);
  font-size:12px;font-family:'Outfit',sans-serif;outline:none;
}
#srch:focus{border-color:var(--accent);}
#srch::placeholder{color:var(--muted);}
.srt{
  background:var(--bg3);border:1.5px solid var(--border);color:var(--muted);
  padding:5px 9px;border-radius:var(--r2);cursor:pointer;
  font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;white-space:nowrap;
}
.srt.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ── WEIGHT/VOLUME FILTER BAR ── */
.filter-bar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  position:sticky;top:calc(44px + var(--filter-h));z-index:99;
}

/* Type toggle group */
.ftype-group{
  display:flex;border:1.5px solid var(--border);border-radius:var(--r2);overflow:hidden;
  flex-shrink:0;
}
.ftype-btn{
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;border:none;background:transparent;
  color:var(--muted);transition:all .13s;white-space:nowrap;
}
.ftype-btn.on{background:var(--ink);color:#fff;}
.ftype-btn:not(:last-child){border-right:1px solid var(--border);}

/* Range chips */
.frange-wrap{
  display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;
}
.fchip{
  padding:3px 9px;font-size:10px;font-weight:700;
  border:1.5px solid var(--border);border-radius:20px;
  cursor:pointer;font-family:'Outfit',sans-serif;
  color:var(--muted);background:var(--bg3);
  transition:all .13s;white-space:nowrap;user-select:none;
}
.fchip:hover{border-color:var(--accent);color:var(--accent);}
.fchip.on{
  background:var(--accent);border-color:var(--accent);
  color:#fff;
}
.fchip.on:hover{opacity:.88;}

/* Active filter badge on cat-view show */
.filter-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(200,65,11,.1);border:1px solid rgba(200,65,11,.2);
  color:var(--accent);padding:2px 7px;border-radius:12px;
  font-size:9px;font-weight:700;font-family:'Space Mono',monospace;
  margin-left:auto;flex-shrink:0;cursor:pointer;
}
.filter-badge:hover{background:rgba(200,65,11,.18);}
.filter-badge svg{width:9px;height:9px;stroke-width:2.5;}
.filter-badge.hidden{display:none;}

/* Custom range inputs */
.custom-range-wrap{
  display:none;align-items:center;gap:6px;margin-top:6px;
  width:100%;padding-top:2px;
}
.custom-range-wrap.show{display:flex;}
.cr-input{
  width:72px;background:var(--bg3);border:1.5px solid var(--border);
  color:var(--text);padding:4px 7px;border-radius:var(--r2);
  font-size:11px;font-family:'Space Mono',monospace;outline:none;
}
.cr-input:focus{border-color:var(--accent);}
.cr-label{font-size:10px;color:var(--muted);font-weight:600;}
.cr-unit{font-size:10px;color:var(--muted);}
.cr-apply{
  padding:4px 10px;font-size:10px;font-weight:700;
  background:var(--accent);border:none;border-radius:var(--r2);
  color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;
}

/* ── TABLE (Excel style) ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 40px;}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px;}

thead th{
  background:var(--bg3);
  padding:9px 12px;
  font-size:9px;font-weight:700;letter-spacing:.8px;
  color:var(--muted);text-transform:uppercase;
  border-bottom:2px solid var(--border);
  white-space:nowrap;
}
thead th.store-th{text-align:center;}
thead th.right{text-align:right;}
thead th:first-child{text-align:left;border-radius:var(--r2) 0 0 0;min-width:160px;}
thead th:last-child{border-radius:0 var(--r2) 0 0;}

.th-store-pill{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
.th-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--bg3);}
tbody tr:last-child{border-bottom:none;}

td{padding:9px 12px;vertical-align:middle;}
.td-name{font-size:12px;font-weight:500;color:var(--text);line-height:1.3;max-width:175px;}

/* Per-kg badge inside product name */
.pkg-badge{
  display:inline-block;
  font-family:'Space Mono',monospace;font-size:8px;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--muted);border-radius:4px;padding:1px 4px;
  margin-left:4px;vertical-align:middle;white-space:nowrap;
}

.td-price{text-align:center;white-space:nowrap;min-width:80px;}

.pval{
  display:inline-flex;align-items:center;gap:3px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  color:var(--text);
  border-radius:5px;padding:3px 7px;
  background:transparent;
}
.pval.cheap{
  color:var(--cheap-c);background:var(--cheap-bg);
  border:1px solid var(--cheap-border);
}
.pval .star{font-size:9px;color:var(--cheap-c);}
.pval.xpen{
  color:var(--exp-c);background:var(--exp-bg);
  border:1px solid var(--exp-border);
}
.pval .reddot{
  width:6px;height:6px;border-radius:50%;
  background:var(--exp-c);flex-shrink:0;
}
.pval.wonly{color:var(--wolt-c);opacity:.8;}
.wsuf{
  font-family:'Space Mono',monospace;font-size:7px;
  color:var(--wolt-c);opacity:.7;
  vertical-align:super;margin-left:1px;font-weight:400;
}

.dash{color:var(--border);font-size:16px;}

.td-saving{text-align:right;white-space:nowrap;min-width:60px;}
.sav-val{
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:var(--cheap-c);
}
.sav-none{color:var(--border);font-size:14px;}

/* result counter */
.result-count{
  padding:6px 18px 0;
  font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;
}

.empty-st{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

/* ── MOBILE ── */
@media(max-width:600px){
  :root{--filter-h:88px;}
  .unit-cards{grid-template-columns:repeat(2,1fr);}
  .toolbar{top:40px;padding:8px 12px;}
  .filter-bar{top:calc(40px + 43px);padding:7px 12px;gap:6px;}
  .tbl-wrap{padding:10px 10px 30px;}
  #home-view{padding:12px;}
  thead th{font-size:8px;padding:7px 8px;}
  td{padding:7px 8px;}
  .td-name{font-size:11px;max-width:100px;}
  .pval{font-size:11px;padding:2px 5px;}
  #cat-title{font-size:15px;}
  .cat-top{padding:12px;}
  .unit-section{padding:9px 12px 11px;}
  .ftype-btn{padding:3px 7px;font-size:10px;}
  .fchip{font-size:9px;padding:2px 7px;}
}
@media(max-width:380px){
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .unit-cards{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <button id="back-btn" onclick="showHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Geri
  </button>
  <div class="logo">Qiymət<em>Müqayisə</em></div>
  <div id="last-upd"></div>
</header>

<!-- HOME -->
<div id="home-view">
  <div class="sec-label">Kateqoriyalar</div>
  <div id="loading"><div class="spinner"></div>Yüklənir…</div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- CATEGORY VIEW -->
<div id="cat-view">
  <div class="cat-top">
    <div id="cat-icon"></div>
    <div>
      <div id="cat-title"></div>
      <div id="cat-sub"></div>
    </div>
  </div>

  <!-- Smart unit price cards -->
  <div class="unit-section">
    <div class="unit-sec-label">Ən sərfəli qiymət — vahid üzrə (kq / litr)</div>
    <div class="unit-cards" id="unit-cards"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Məhsul axtar…" oninput="rerender()"/>
    <button class="srt on" onclick="setSort('name',this)">A→Z</button>
    <button class="srt"    onclick="setSort('asc',this)">Ucuz↑</button>
    <button class="srt"    onclick="setSort('sav',this)">Qənaət↓</button>
  </div>

  <!-- ── WEIGHT / VOLUME FILTER BAR ── -->
  <div class="filter-bar" id="filter-bar">

    <!-- Type toggle: All / Solid / Liquid / No-weight -->
    <div class="ftype-group">
      <button class="ftype-btn on" data-type="all"   onclick="setFType('all',this)">Hamısı</button>
      <button class="ftype-btn"    data-type="solid"  onclick="setFType('solid',this)">⚖ Çəki</button>
      <button class="ftype-btn"    data-type="liquid" onclick="setFType('liquid',this)">💧 Həcm</button>
      <button class="ftype-btn"    data-type="none"   onclick="setFType('none',this)">📦 Digər</button>
    </div>

    <!-- Range chips (shown for solid/liquid) -->
    <div class="frange-wrap" id="frange-wrap">
      <!-- chips injected by JS -->
    </div>

    <!-- Active filter clear badge -->
    <div class="filter-badge hidden" id="filter-badge" onclick="clearFilter()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Filtri sil
    </div>
  </div>

  <!-- Custom range row (shown on "öz aralığı" chip) -->
  <div class="custom-range-wrap" id="custom-range-wrap">
    <span class="cr-label">Aralıq:</span>
    <input class="cr-input" id="cr-min" type="number" min="0" placeholder="min"/>
    <span class="cr-unit" id="cr-unit-label">q</span>
    <span class="cr-label" style="opacity:.5">—</span>
    <input class="cr-input" id="cr-max" type="number" min="0" placeholder="max"/>
    <span class="cr-unit" id="cr-unit-label2">q</span>
    <button class="cr-apply" onclick="applyCustomRange()">Tətbiq et</button>
  </div>

  <!-- Result count -->
  <div class="result-count" id="result-count"></div>

  <!-- Excel table -->
  <div class="tbl-wrap">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-st" id="empty" style="display:none">Məhsul tapılmadı</div>
  </div>
</div>

<script>
const SC={Bravo:"#d72b3f",OBA:"#1a5fe0",Araz:"#7c3aed",Neptun:"#0d9b6e",Rahat:"#e05c14"};
const CI={
  sud:"🥛",yumurta:"🥚",kere_yagi:"🧈",pendir:"🧀",qatiq:"🫙",xama:"🥄",kefir:"🥛",ayran:"🥤",
  kartof:"🥔",pomidor:"🍅",xiyar:"🥒",soyan:"🧅",kelem:"🥬",yerkoyu:"🥕",cuqundur:"🫚",
  badimcan:"🍆",biber:"🌶️",sarimsaq:"🧄",ispanaq:"🌿",
  alma:"🍎",armud:"🍐",saftal:"🍑",gilas:"🍒",uzum:"🍇",banan:"🍌",kivi:"🥝",
  limon:"🍋",portaqal:"🍊",nar:"🍎",
  toyuq:"🍗",dana_ati:"🥩",qoyun_ati:"🍖",hindi:"🦃",kolbasa:"🌭",sosis:"🌭",baliq:"🐟",
  duyu:"🍚",merci:"🫘",noxud:"🟡",fasulya:"🫘",qarabashaq:"🌾",yulaf:"🌾",
  un:"🌾",makaron:"🍝",corek:"🍞",pecenye:"🍪",
  cay:"🍵",qehve:"☕",sire:"🧃",su:"💧",kola:"🥤",energetik:"⚡",
  sokolad:"🍫",halva:"🍬",bal:"🍯",dondurma:"🍦",
  zeytun_yagi:"🫒",bitki_yagi:"🌻",mayonez:"🫙",ketcup:"🍅",
  duz:"🧂",sekerqum:"🍬",istiot:"🌶️",
};

/* ── Filter state ── */
const FILTER = {
  type: 'all',    // 'all' | 'solid' | 'liquid' | 'none'
  range: null,    // null | {min, max}  (in grams/ml)
  customActive: false,
};

/* Preset ranges per type (in grams / ml) */
const RANGES = {
  solid:  [
    {label:'< 250 q',   min:0,    max:250},
    {label:'250–500 q', min:250,  max:500},
    {label:'500q–1 kq', min:500,  max:1000},
    {label:'1–2 kq',    min:1000, max:2000},
    {label:'2 kq +',    min:2000, max:Infinity},
    {label:'Öz aralığı',custom:true},
  ],
  liquid: [
    {label:'< 250 ml',   min:0,    max:250},
    {label:'250–500 ml', min:250,  max:500},
    {label:'500ml–1 L',  min:500,  max:1000},
    {label:'1–2 L',      min:1000, max:2000},
    {label:'2 L +',      min:2000, max:Infinity},
    {label:'Öz aralığı', custom:true},
  ],
};

let DATA=null, STORES=[], sortMode='name', allRows=[];

/* ── Weight parsing ── */
function parseWeight(name){
  const n = name.toLowerCase();
  const pats = [
    {re:/(\d+[\.,]?\d*)\s*kq\b/i,  mult:1000, liq:false},
    {re:/(\d+[\.,]?\d*)\s*kg\b/i,  mult:1000, liq:false},
    {re:/(\d+[\.,]?\d*)\s*litr/i,  mult:1000, liq:true},
    {re:/(\d+[\.,]?\d*)\s*\bl\b/i, mult:1000, liq:true},
    {re:/(\d+[\.,]?\d*)\s*lt\b/i,  mult:1000, liq:true},
    {re:/(\d+[\.,]?\d*)\s*ml\b/i,  mult:1,    liq:true},
    {re:/(\d+[\.,]?\d*)\s*\bq\b/i, mult:1,    liq:false},
    {re:/(\d+[\.,]?\d*)\s*gr?\b/i, mult:1,    liq:false},
    {re:/(\d+[\.,]?\d*)\s*г\b/i,   mult:1,    liq:false},
    {re:/(\d+[\.,]?\d*)\s*кг\b/i,  mult:1000, liq:false},
  ];
  for(const p of pats){
    const m = n.match(p.re);
    if(m){
      const v = parseFloat(m[1].replace(',','.'));
      if(v > 0) return {grams: v*p.mult, isLiquid: p.liq};
    }
  }
  return null;
}

function perKg(price, wg){
  if(!wg || price == null || wg.grams <= 0) return null;
  return price / wg.grams * 1000;
}

/* ── Init ── */
async function init(){
  try{
    const r = await fetch('data/prices.json');
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    STORES = DATA.stores || ["Bravo","OBA","Araz","Neptun","Rahat"];
    if(DATA.last_updated)
      document.getElementById('last-upd').textContent = '↺ '+DATA.last_updated;
    buildGrid();
  }catch(e){
    document.getElementById('loading').innerHTML =
      `<div style="color:#d72b3f;font-size:14px">❌ data/prices.json yüklənmədi<br>
      <small style="opacity:.5;font-size:11px">python -m http.server 8000</small></div>`;
  }
}

function buildGrid(){
  document.getElementById('loading').style.display='none';
  const grid = document.getElementById('cat-grid');
  let html='';
  for(const[id,cat] of Object.entries(DATA.categories)){
    const total=Object.values(cat.stores||{}).reduce((s,a)=>s+a.length,0);
    if(!total) continue;
    const dots=STORES
      .filter(s=>cat.stores&&cat.stores[s]&&cat.stores[s].length>0)
      .map(s=>`<div class="sdot" style="background:${SC[s]||'#888'}"></div>`).join('');
    html+=`<div class="cat-card" onclick="openCat('${id}')">
      <div class="cat-icon">${CI[id]||'📦'}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-meta">
        <div class="cat-cnt">${total}</div>
        <div class="cat-dots">${dots}</div>
      </div></div>`;
  }
  grid.innerHTML = html||'<div style="color:var(--muted)">Məlumat yoxdur</div>';
}

/* ── Similarity ── */
function sim(a,b){
  const wa=new Set(a.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  const wb=new Set(b.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean));
  let i=0; wa.forEach(w=>{if(wb.has(w))i++;});
  return i/Math.max(wa.size,wb.size,1);
}

/* ── Open category ── */
function openCat(catId){
  sortMode='name';
  document.querySelectorAll('.srt').forEach((b,i)=>b.classList.toggle('on',i===0));
  document.getElementById('srch').value='';

  // Reset filter
  FILTER.type='all';
  FILTER.range=null;
  FILTER.customActive=false;
  updateFilterUI();

  const cat = DATA.categories[catId];
  document.getElementById('cat-icon').textContent = CI[catId]||'📦';
  document.getElementById('cat-title').textContent = cat.name;

  const storeItems={};
  STORES.forEach(s=>{storeItems[s]=(cat.stores&&cat.stores[s])?[...cat.stores[s]]:[];});

  const anchor=STORES.slice().sort((a,b)=>storeItems[b].length-storeItems[a].length)[0];
  const used={};STORES.forEach(s=>used[s]=new Set());
  const unified=[];

  storeItems[anchor].forEach((item,idx)=>{
    const row={name:item.name,prices:{}};
    row.prices[anchor]={own:item.price,wolt:item.wolt_price};
    used[anchor].add(idx);
    STORES.filter(s=>s!==anchor).forEach(s=>{
      let bs=0,bi=-1;
      storeItems[s].forEach((si,i)=>{
        if(used[s].has(i))return;
        const v=sim(item.name,si.name);
        if(v>bs){bs=v;bi=i;}
      });
      if(bs>=0.5&&bi>=0){
        row.prices[s]={own:storeItems[s][bi].price,wolt:storeItems[s][bi].wolt_price};
        used[s].add(bi);
      }
    });
    unified.push(row);
  });
  STORES.filter(s=>s!==anchor).forEach(s=>{
    storeItems[s].forEach((item,idx)=>{
      if(used[s].has(idx))return;
      unified.push({name:item.name,prices:{[s]:{own:item.price,wolt:item.wolt_price}}});
    });
  });

  unified.forEach(row=>{
    row._wg = parseWeight(row.name);
    const ownEntries = STORES
      .filter(s=>row.prices[s]&&row.prices[s].own!=null)
      .map(s=>({s, p:row.prices[s].own}));
    ownEntries.sort((a,b)=>a.p-b.p);
    row._cheapStore = ownEntries[0]||null;
    row._expStore   = ownEntries.length>1 ? ownEntries[ownEntries.length-1] : null;
    row._saving     = ownEntries.length>1
      ? Math.round((row._expStore.p - row._cheapStore.p)*100)/100 : 0;
    row._cheapPerKg = (row._cheapStore && row._wg)
      ? perKg(row._cheapStore.p, row._wg) : null;
  });

  allRows = unified;
  const act=STORES.filter(s=>storeItems[s].length>0).join(', ');
  document.getElementById('cat-sub').textContent=`${unified.length} məhsul • ${act}`;

  buildUnitCards(unified);
  buildTableHeader();
  rerender();

  document.getElementById('home-view').style.display='none';
  document.getElementById('cat-view').style.display='block';
  document.getElementById('back-btn').style.display='flex';
  window.scrollTo(0,0);
}

/* ── Filter UI helpers ── */
function setFType(type, btn){
  FILTER.type = type;
  FILTER.range = null;
  FILTER.customActive = false;
  document.getElementById('custom-range-wrap').classList.remove('show');
  document.querySelectorAll('.ftype-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  updateRangeChips();
  updateFilterBadge();
  rerender();
}

function updateRangeChips(){
  const wrap = document.getElementById('frange-wrap');
  const list = RANGES[FILTER.type];
  if(!list){wrap.innerHTML='';return;}

  let html='';
  list.forEach((r,i)=>{
    const label = esc(r.label);
    if(r.custom){
      html+=`<div class="fchip" id="fchip-custom" onclick="toggleCustomRange(this)">${label}</div>`;
    } else {
      html+=`<div class="fchip" onclick="setFRange(${r.min},${r.max==='Infinity'?'Infinity':r.max},this)">${label}</div>`;
    }
  });
  wrap.innerHTML=html;
}

function setFRange(min, max, chip){
  FILTER.range = {min, max: max===Infinity||max==='Infinity'?Infinity:Number(max)};
  FILTER.customActive = false;
  document.getElementById('custom-range-wrap').classList.remove('show');
  document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));
  chip.classList.add('on');
  updateFilterBadge();
  rerender();
}

function toggleCustomRange(chip){
  const wrap = document.getElementById('custom-range-wrap');
  const showing = wrap.classList.contains('show');
  document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));
  if(showing){
    wrap.classList.remove('show');
    FILTER.customActive=false;
    FILTER.range=null;
  } else {
    wrap.classList.add('show');
    chip.classList.add('on');
    const unitLabel = FILTER.type==='liquid'?'ml':'q';
    document.getElementById('cr-unit-label').textContent=unitLabel;
    document.getElementById('cr-unit-label2').textContent=unitLabel;
    document.getElementById('cr-min').value='';
    document.getElementById('cr-max').value='';
  }
  updateFilterBadge();
  rerender();
}

function applyCustomRange(){
  const mn = parseFloat(document.getElementById('cr-min').value)||0;
  const mx = parseFloat(document.getElementById('cr-max').value)||Infinity;
  FILTER.range = {min:mn, max:mx===0?Infinity:mx};
  FILTER.customActive = true;
  updateFilterBadge();
  rerender();
}

function clearFilter(){
  FILTER.type='all';
  FILTER.range=null;
  FILTER.customActive=false;
  document.querySelectorAll('.ftype-btn').forEach((b,i)=>b.classList.toggle('on',i===0));
  document.getElementById('custom-range-wrap').classList.remove('show');
  updateFilterUI();
  rerender();
}

function updateFilterUI(){
  updateRangeChips();
  updateFilterBadge();
}

function updateFilterBadge(){
  const badge = document.getElementById('filter-badge');
  const hasFilter = FILTER.type!=='all' || FILTER.range!=null;
  badge.classList.toggle('hidden', !hasFilter);
}

/* ── Apply weight/volume filter to a row ── */
function rowPassesFilter(row){
  if(FILTER.type==='all' && !FILTER.range) return true;

  const wg = row._wg;

  if(FILTER.type==='solid')  { if(!wg || wg.isLiquid)  return false; }
  if(FILTER.type==='liquid') { if(!wg || !wg.isLiquid) return false; }
  if(FILTER.type==='none')   { return !wg; }

  if(FILTER.range && wg){
    const g = wg.grams;
    if(g < FILTER.range.min || g > FILTER.range.max) return false;
  }
  return true;
}

/* ── Smart unit price cards ── */
function buildUnitCards(rows){
  let bestSolid=null, bestLiquid=null, best100g=null, best100ml=null;

  rows.forEach(row=>{
    if(!row._wg) return;
    STORES.forEach(s=>{
      const p=row.prices[s];
      if(!p||p.own==null) return;
      const pk = perKg(p.own, row._wg);
      if(pk==null||pk<=0) return;
      const p100 = pk / 10;

      if(!row._wg.isLiquid){
        if(!bestSolid||pk<bestSolid.pk)
          bestSolid={pk, store:s, name:row.name, price:p.own, wg:row._wg};
        if(!best100g||p100<best100g.p100) best100g={p100,store:s,name:row.name};
      } else {
        if(!bestLiquid||pk<bestLiquid.pk)
          bestLiquid={pk, store:s, name:row.name, price:p.own, wg:row._wg};
        if(!best100ml||p100<best100ml.p100) best100ml={p100,store:s,name:row.name};
      }
    });
  });

  function cardHTML(label, data, priceVal){
    if(!data){
      return `<div class="unit-card">
        <div class="unit-card-heading">${label}</div>
        <div class="unit-card-empty">—</div>
      </div>`;
    }
    const sc=SC[data.store]||'#888';
    const shortName=data.name.length>24?data.name.slice(0,24)+'…':data.name;
    return `<div class="unit-card has-data">
      <div class="unit-card-heading">${label}</div>
      <div class="unit-card-price">₼${fmt(priceVal)}</div>
      <div class="unit-card-name">${esc(shortName)}</div>
      <div class="unit-card-store">
        <div class="unit-card-dot" style="background:${sc}"></div>
        <span class="unit-card-store-name">${data.store}</span>
      </div>
    </div>`;
  }

  document.getElementById('unit-cards').innerHTML =
    cardHTML('100 q',  best100g,  best100g  ? best100g.p100  : null) +
    cardHTML('100 ml', best100ml, best100ml ? best100ml.p100 : null) +
    cardHTML('1 kq',   bestSolid, bestSolid ? bestSolid.pk   : null) +
    cardHTML('1 L',    bestLiquid,bestLiquid? bestLiquid.pk  : null);
}

/* ── Table header ── */
function buildTableHeader(){
  let h='<tr><th>Məhsul</th>';
  STORES.forEach(s=>{
    h+=`<th class="store-th"><div class="th-store-pill">
      <div class="th-dot" style="background:${SC[s]||'#888'}"></div>${s}
    </div></th>`;
  });
  h+='<th class="right">Qənaət</th></tr>';
  document.getElementById('thead').innerHTML=h;
}

/* ── Sort + filter ── */
function getSorted(){
  const q=(document.getElementById('srch').value||'').toLowerCase().trim();
  let rows=q?allRows.filter(r=>r.name.toLowerCase().includes(q)):[...allRows];
  // Apply weight/volume filter
  rows=rows.filter(rowPassesFilter);

  if(sortMode==='name')
    rows.sort((a,b)=>a.name.localeCompare(b.name,'az'));
  else if(sortMode==='asc')
    rows.sort((a,b)=>(a._cheapStore?.p??999)-(b._cheapStore?.p??999));
  else if(sortMode==='sav')
    rows.sort((a,b)=>b._saving-a._saving);
  return rows;
}

function rerender(){ renderRows(getSorted()); }

/* ── Render table rows ── */
function renderRows(rows){
  const body=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  const cnt=document.getElementById('result-count');

  if(!rows.length){
    body.innerHTML='';
    empty.style.display='block';
    cnt.textContent='';
    return;
  }
  empty.style.display='none';

  const hasFilter = FILTER.type!=='all' || FILTER.range!=null;
  cnt.textContent = hasFilter ? `${rows.length} nəticə göstərilir` : '';

  let html='';
  rows.forEach(row=>{
    // per-kg badge for name column
    let pkgBadge='';
    if(row._wg && row._cheapPerKg){
      const unit = row._wg.isLiquid ? 'L' : 'kq';
      pkgBadge=`<span class="pkg-badge">₼${fmt(row._cheapPerKg)}/${unit}</span>`;
    }

    let cells='';
    STORES.forEach(s=>{
      const p=row.prices[s];
      if(!p){
        cells+=`<td class="td-price"><span class="dash">—</span></td>`;
        return;
      }
      const hasOwn  = p.own!=null;
      const hasWolt = p.wolt!=null;
      const isCheap = hasOwn && row._cheapStore && row._cheapStore.s===s;
      const isExp   = hasOwn && row._expStore   && row._expStore.s===s && row._saving>0;

      let inner='';
      if(hasOwn){
        const woltSuffix = hasWolt&&p.wolt!==p.own
          ?`<span class="wsuf">w${fmt(p.wolt)}</span>`:'';
        let cls='pval';
        if(isCheap) cls+=' cheap';
        else if(isExp) cls+=' xpen';
        let badge='';
        if(isCheap) badge=`<span class="star">★</span>`;
        else if(isExp) badge=`<div class="reddot"></div>`;
        inner=`<span class="${cls}">₼${fmt(p.own)}${woltSuffix}${badge}</span>`;
      } else if(hasWolt){
        inner=`<span class="pval wonly">₼${fmt(p.wolt)}<span class="wsuf">w</span></span>`;
      } else {
        inner=`<span class="dash">—</span>`;
      }
      cells+=`<td class="td-price">${inner}</td>`;
    });

    const savCell = row._saving>0
      ?`<td class="td-saving"><span class="sav-val">−₼${fmt(row._saving)}</span></td>`
      :`<td class="td-saving"><span class="sav-none">—</span></td>`;

    html+=`<tr>
      <td class="td-name">${esc(row.name)}${pkgBadge}</td>
      ${cells}${savCell}
    </tr>`;
  });
  body.innerHTML=html;
}

/* ── Helpers ── */
function setSort(m,btn){
  sortMode=m;
  document.querySelectorAll('.srt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  rerender();
}
function showHome(){
  document.getElementById('home-view').style.display='block';
  document.getElementById('cat-view').style.display='none';
  document.getElementById('back-btn').style.display='none';
  window.scrollTo(0,0);
}
function fmt(n){return n!=null?Number(n).toFixed(2):'—';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

init();
</script>
