        cola: "Coca-Cola", "coca-cola": "Coca-Cola", fanta: "Fanta", sirab: "Mineral Su", sandora: "Meyvə Şirəsi"
      },
      sirniyyat: {
        albeni: "Albeni", snickers: "Snickers", nutella: "Nutella"
      }
    };

    // Jaccard similarity helpers
    function getTokens(str) {
      const clean = str.toLowerCase()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
        .replace(/ç/g, "c").replace(/ə/g, "e").replace(/ğ/g, "g")
        .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u");
      return new Set(clean.split(/\s+/).filter(Boolean));
    }

    function calculateJaccard(str1, str2) {
      const set1 = getTokens(str1);
      const set2 = getTokens(str2);
      if (set1.size === 0 && set2.size === 0) return 1;
      if (set1.size === 0 || set2.size === 0) return 0;
      const intersection = new Set([...set1].filter(x => set2.has(x)));
      const union = new Set([...set1, ...set2]);
      return intersection.size / union.size;
    }

    function extractProductAttributes(name, categoryId) {
      const lowerName = name.toLowerCase();
      
      // Fat Spec
      let fatPercentage = null;
      const fatMatch = name.match(/([0-9]+(?:[\.,][0-9]+)?)\s*%/);
      if (fatMatch) {
        fatPercentage = parseFloat(fatMatch[1].replace(",", "."));
      }

      // Weight Spec
      let weightValue = null;
      let weightUnit = null;
      const weightRegex = /([0-9]+(?:[\.,][0-9]+)?)\s*(kq|q|qr|l|ml|ədəd|gr)/i;
      const weightMatch = name.match(weightRegex);

      if (weightMatch) {
        weightValue = parseFloat(weightMatch[1].replace(",", "."));
        const rawUnit = weightMatch[2].toLowerCase();
        if (rawUnit === "l") weightUnit = "L";
        else if (rawUnit === "ml") weightUnit = "ml";
        else if (rawUnit === "kq") weightUnit = "kq";
        else if (rawUnit === "q" || rawUnit === "qr" || rawUnit === "gr") weightUnit = "q";
        else weightUnit = "ədəd";
      } else {
        if (name.includes("10-luq") || name.includes("10 ədəd") || name.includes("10 adet")) {
          weightValue = 10; weightUnit = "ədəd";
        } else if (name.includes("15-lik") || name.includes("15 ədəd")) {
          weightValue = 15; weightUnit = "ədəd";
        } else if (name.includes("30-luq")) {
          weightValue = 30; weightUnit = "ədəd";
        }
      }

      let subtype = "Digər";
      const catKeywords = SUBTYPE_KEYWORDS[categoryId];
      if (catKeywords) {
        for (const kw in catKeywords) {
          if (lowerName.includes(kw)) {
            subtype = catKeywords[kw];
            break;
          }
        }
      }
      return { subtype, weightValue, weightUnit, fatPercentage };
    }

    function normalizeWeight(value, unit) {
      if (value === null || !unit) return 1;
      const u = unit.toLowerCase();
      if (u === "kq" || u === "l") return value * 1000;
      return value;
    }

    function mergeCategoryProducts(categoryData, categoryId) {
      const unifiedList = [];
      const storeNames = Object.keys(categoryData.stores);
      let idCounter = 1;

      for (const store of storeNames) {
        const products = categoryData.stores[store];
        for (const item of products) {
          let bestMatch = null;
          let highestScore = 0;

          for (const unified of unifiedList) {
            for (const rawName of unified.rawNames) {
              const score = calculateJaccard(rawName, item.name);
              if (score > highestScore) {
                highestScore = score;
                bestMatch = unified;
              }
            }
          }

          if (bestMatch && highestScore >= 0.5) {
            if (!bestMatch.offers[store]) {
              bestMatch.offers[store] = item;
              bestMatch.rawNames.push(item.name);
            }
          } else {
            const attributes = extractProductAttributes(item.name, categoryId);
            unifiedList.push({
              id: `${categoryId}_${idCounter++}`,
              name: item.name,
              rawNames: [item.name],
              attributes,
              offers: { [store]: item }
            });
          }
        }
      }
      return unifiedList;
    }

    // --- MAIN REACT COMPONENT ---
    function App() {
      const [selectedCategoryId, setSelectedCategoryId] = useState(null);
      const [globalSearchQuery, setGlobalSearchQuery] = useState("");
      const [highlightedProductId, setHighlightedProductId] = useState(null);
      const [isWoltPremiumMode, setIsWoltPremiumMode] = useState(false);

      // Category Toolbar parameters
      const [selectedSubtype, setSelectedSubtype] = useState(null);
      const [weightMode, setWeightMode] = useState("Hamısı");
      const [minWeightInput, setMinWeightInput] = useState("");
      const [maxWeightInput, setMaxWeightInput] = useState("");
      const [selectedFatPercentage, setSelectedFatPercentage] = useState(null);
      const [tableSearchQuery, setTableSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("savings_desc");

      const globalSearchRef = useRef(null);

      // Pre-compile Jaccard merged components
      const groupedCategories = useMemo(() => {
        const categoriesMap = {};
        for (const [catId, catData] of Object.entries(initialPricesData.categories)) {
          categoriesMap[catId] = mergeCategoryProducts(catData, catId);
        }
        return categoriesMap;
      }, []);

      // Calculate global stats of Baku supermarkets
      const stats = useMemo(() => {
        let totalItemsCount = 0;
        let maxSavingFound = 0;
        let maxSavingProduct = "";
        let priceSum = 0;
        let totalOffers = 0;

        for (const [catId, products] of Object.entries(groupedCategories)) {
          totalItemsCount += products.length;
          for (const item of products) {
            const prices = Object.values(item.offers).map(o => isWoltPremiumMode ? o.wolt_price : o.price);
            if (prices.length > 1) {
              const maxPrice = Math.max(...prices);
              const minPrice = Math.min(...prices);
              const saving = maxPrice - minPrice;
              if (saving > maxSavingFound) {
                maxSavingFound = saving;
                maxSavingProduct = item.name;
              }
            }
            prices.forEach(p => {
              priceSum += p;
              totalOffers++;
            });
          }
        }

        return {
          totalCategories: Object.keys(groupedCategories).length,
          totalItems: totalItemsCount,
          totalStores: initialPricesData.stores.length,
          maxSaving: maxSavingFound,
          maxSavingProduct,
          avgPrice: totalOffers > 0 ? priceSum / totalOffers : 0
        };
      }, [groupedCategories, isWoltPremiumMode]);

      // Global Search Auto-complete matching Indexer
      const globalSearchResults = useMemo(() => {
        if (!globalSearchQuery.trim()) return [];
        const cleanSearchStr = (s) => s.toLowerCase()
          .replace(/ç/g, "c").replace(/ə/g, "e").replace(/ğ/g, "g")
          .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u")
          .trim();

        const query = cleanSearchStr(globalSearchQuery);
        const results = [];

        for (const [catId, products] of Object.entries(groupedCategories)) {
          const catData = initialPricesData.categories[catId];
          for (const item of products) {
            const matchesName = cleanSearchStr(item.name).includes(query) ||
              item.rawNames.some(rn => cleanSearchStr(rn).includes(query));

            if (matchesName) {
              const offers = Object.entries(item.offers);
              let cheapestPrice = Infinity;
              let cheapestStore = "";
              
              offers.forEach(([store, off]) => {
                const currentPrice = isWoltPremiumMode ? off.wolt_price : off.price;
                if (currentPrice < cheapestPrice) {
                  cheapestPrice = currentPrice;
                  cheapestStore = store;
                }
              });

              results.push({
                productId: item.id,
                matchedName: item.name,
                categoryId: catId,
                categoryName: catData.name,
                cheapestStore,
                cheapestPrice
              });
            }
          }
        }
        return results;
      }, [globalSearchQuery, groupedCategories, isWoltPremiumMode]);

      // Global hotkeys ( '/' and 'Esc' )
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "/") {
            if (document.activeElement.tagName !== "INPUT") {
              e.preventDefault();
              globalSearchRef.current?.focus();
            }
          } else if (e.key === "Escape") {
            if (globalSearchQuery) {
              setGlobalSearchQuery("");
              globalSearchRef.current?.blur();
            } else if (selectedCategoryId) {
              setSelectedCategoryId(null);
              setSelectedSubtype(null);
            }
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [globalSearchQuery, selectedCategoryId]);

      const jumpToProductInTable = (catId, prodId) => {
        setSelectedCategoryId(catId);
        setGlobalSearchQuery("");
        setSelectedSubtype(null);
        setWeightMode("Hamısı");
        setTableSearchQuery("");
        setHighlightedProductId(prodId);

        setTimeout(() => {
          const element = document.getElementById(`row-${prodId}`);
          if (element) {
            element.scrollIntoView({ behavior: "smooth", block: "center" });
            setTimeout(() => setHighlightedProductId(null), 4000);
          }
        }, 300);
      };

      const currentCategoryProducts = useMemo(() => {
        if (!selectedCategoryId) return [];
        return groupedCategories[selectedCategoryId] || [];
      }, [selectedCategoryId, groupedCategories]);

      const dynamicFilterOptions = useMemo(() => {
        if (!selectedCategoryId) return { subtypes: [], fats: [] };
        const rawProducts = currentCategoryProducts;
        const subtypesMap = {};
        const fatsSet = new Set();

        rawProducts.forEach(item => {
          if (item.attributes.subtype) {
            subtypesMap[item.attributes.subtype] = (subtypesMap[item.attributes.subtype] || 0) + 1;
          }
          if (item.attributes.fatPercentage !== null) {
            fatsSet.add(item.attributes.fatPercentage);
          }
        });

        const sortedSubtypes = Object.entries(subtypesMap)
          .sort((a, b) => b[1] - a[1])
          .map(entry => entry[0]);

        return {
          subtypes: sortedSubtypes.slice(0, 4),
          fats: Array.from(fatsSet).sort((a, b) => a - b)
        };
      }, [selectedCategoryId, currentCategoryProducts]);

      const filteredCategoryProducts = useMemo(() => {
        if (!selectedCategoryId) return [];
        let items = [...currentCategoryProducts];

        if (selectedSubtype) {
          if (selectedSubtype === "Digər") {
            items = items.filter(item => !dynamicFilterOptions.subtypes.includes(item.attributes.subtype));
          } else {
            items = items.filter(item => item.attributes.subtype === selectedSubtype);
          }
        }

        if (weightMode !== "Hamısı") {
          items = items.filter(item => {
            const unit = item.attributes.weightUnit;
            if (weightMode === "⚖ Çəki") return unit === "kq" || unit === "q";
            else if (weightMode === "💧 Həcm") return unit === "L" || unit === "ml";
            return unit === "ədəd" || unit === null;
          });
        }

        const minW = parseFloat(minWeightInput.replace(",", "."));
        const maxW = parseFloat(maxWeightInput.replace(",", "."));
        if (!isNaN(minW) || !isNaN(maxW)) {
          items = items.filter(item => {
            const val = item.attributes.weightValue;
            if (val === null) return false;
            const normalized = normalizeWeight(val, item.attributes.weightUnit);
            const checkMin = !isNaN(minW) ? normalized >= minW : true;
            const checkMax = !isNaN(maxW) ? normalized <= maxW : true;
            return checkMin && checkMax;
          });
        }

        if (selectedFatPercentage !== null) {
          items = items.filter(item => item.attributes.fatPercentage === selectedFatPercentage);
        }

        if (tableSearchQuery.trim()) {
          const q = tableSearchQuery.toLowerCase()
            .replace(/ç/g, "c").replace(/ə/g, "e").replace(/ğ/g, "g")
            .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u")
            .trim();
          items = items.filter(item => item.name.toLowerCase().includes(q) || item.rawNames.some(rn => rn.toLowerCase().includes(q)));
        }

        items.sort((a, b) => {
          const getPrices = (uItem) => Object.values(uItem.offers).map(o => isWoltPremiumMode ? o.wolt_price : o.price);
          if (sortBy === "name") return a.name.localeCompare(b.name);
          
          const aPrices = getPrices(a);
          const bPrices = getPrices(b);
          const aMin = aPrices.length > 0 ? Math.min(...aPrices) : Infinity;
          const bMin = bPrices.length > 0 ? Math.min(...bPrices) : Infinity;

          if (sortBy === "price_asc") return aMin - bMin;
          if (sortBy === "savings_desc") {
            const calcSavings = (p) => p.length <= 1 ? 0 : Math.max(...p) - Math.min(...p);
            return calcSavings(bPrices) - calcSavings(aPrices);
          }
          return 0;
        });

        return items;
      }, [selectedCategoryId, currentCategoryProducts, selectedSubtype, weightMode, minWeightInput, maxWeightInput, selectedFatPercentage, tableSearchQuery, sortBy, isWoltPremiumMode, dynamicFilterOptions]);

      const storeCheapStats = useMemo(() => {
        const counts = {};
        for (const product of filteredCategoryProducts) {
          const offers = Object.values(product.offers);
          if (offers.length === 0) continue;
          const prices = offers.map(o => isWoltPremiumMode ? o.wolt_price : o.price);
          const minPrice = Math.min(...prices);
          
          Object.entries(product.offers).forEach(([store, off]) => {
            const currentPrice = isWoltPremiumMode ? off.wolt_price : off.price;
            if (currentPrice === minPrice) {
              counts[store] = (counts[store] || 0) + 1;
            }
          });
        }
        return counts;
      }, [filteredCategoryProducts, isWoltPremiumMode]);

      const storeChampionsRanked = useMemo(() => {
        return Object.entries(storeCheapStats).sort((a, b) => b[1] - a[1]);
      }, [storeCheapStats]);

      // Base Bargain Calculator (per 1kq or 1L)
      const unitBargains = useMemo(() => {
        if (!selectedCategoryId || filteredCategoryProducts.length === 0) return [];
        let liquidBest = null;
        let weightBest = null;
        let pieceBest = null;

        filteredCategoryProducts.forEach(prod => {
          const val = prod.attributes.weightValue;
          const unit = prod.attributes.weightUnit;
          if (val === null || !unit) return;

          Object.entries(prod.offers).forEach(([store, off]) => {
            const price = isWoltPremiumMode ? off.wolt_price : off.price;
            const totalSize = normalizeWeight(val, unit);

            if (unit === "L" || unit === "ml") {
              const pricePerL = (price / totalSize) * 1000;
              if (!liquidBest || pricePerL < liquidBest.pricePerUnit) {
                liquidBest = { unitLabel: "1 L", productName: prod.name, storeName: store, pricePerUnit: pricePerL, originalPrice: price, originalQty: `${val} ${unit}` };
              }
            } else if (unit === "kq" || unit === "q") {
              const pricePerKq = (price / totalSize) * 1000;
              if (!weightBest || pricePerKq < weightBest.pricePerUnit) {
                weightBest = { unitLabel: "1 Kq", productName: prod.name, storeName: store, pricePerUnit: pricePerKq, originalPrice: price, originalQty: `${val} ${unit}` };
              }
            } else if (unit === "ədəd") {
              const pricePerPce = price / val;
              if (!pieceBest || pricePerPce < pieceBest.pricePerUnit) {
                pieceBest = { unitLabel: "1 Ədəd", productName: prod.name, storeName: store, pricePerUnit: pricePerPce, originalPrice: price, originalQty: `${val} ədəd` };
              }
            }
          });
        });

        const res = [];
        if (weightBest) res.push(weightBest);
        if (liquidBest) res.push(liquidBest);
        if (pieceBest) res.push(pieceBest);
        return res;
      }, [selectedCategoryId, filteredCategoryProducts, isWoltPremiumMode]);

      function HighlightMatch({ text, query }) {
        if (!query) return <span>{text}</span>;
        const index = text.toLowerCase().indexOf(query.toLowerCase());
        if (index === -1) return <span>{text}</span>;
        const before = text.substring(0, index);
        const match = text.substring(index, index + query.length);
        const after = text.substring(index + query.length);
        return (
          <span>{before}<mark class="bg-warmaccent/30 text-white font-semibold rounded px-0.5 border-b border-warmaccent-light">{match}</mark>{after}</span>
        );
      }

      return (
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 relative z-10">
          
          {/* HEADER BAR */}
          <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-warmaccent/10 mb-8">
            <div>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-warmaccent rounded-xl flex items-center justify-center shadow-lg shadow-warmaccent/20 border border-warmaccent-light/30">
                  <i data-lucide="trending-up" class="w-5 h-5 text-warmblack"></i>
                </div>
                <div>
                  <h1 class="text-3xl font-black font-display tracking-tight text-white flex items-center gap-2">
                    Qiymət<span class="text-warmaccent">Müqayisə</span>
                  </h1>
                  <p class="text-[10px] font-mono text-warmaccent-light/70 mt-0.5">REAL VAXTDA BAKI SUPERMARKETLƏRİ MONİTORİNQİ</p>
                </div>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
              {/* Wolt Premium mode key slider switch */}
              <button 
                onClick={() => setIsWoltPremiumMode(!isWoltPremiumMode)}
                class={`px-4 py-2.5 rounded-xl border flex items-center justify-between sm:justify-start gap-4 transition-all duration-300 cursor-pointer text-xs font-semibold ${
                  isWoltPremiumMode 
                    ? "bg-sky-500/10 border-sky-400 text-sky-400" 
                    : "bg-warmlight border-warmaccent/10 text-neutral-400 hover:text-white"
                }`}
              >
                <span class="flex items-center gap-2">
                  <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                  Wolt Çatdırılma Qiymətləri
                </span>
                <div class={`w-8 h-4 rounded-full p-0.5 transition-colors ${isWoltPremiumMode ? "bg-sky-500" : "bg-neutral-800"}`}>
                  <div class={`bg-white w-3 h-3 rounded-full transition-transform transform ${isWoltPremiumMode ? 'translate-x-4' : 'translate-x-0'}`}></div>
                </div>
              </button>

              <div class="bg-warmlight border border-warmaccent/10 px-4 py-2.5 rounded-xl flex items-center gap-2 text-xs text-neutral-400">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-warmaccent"></i>
                <span>{initialPricesData.last_updated}</span>
              </div>
            </div>
          </header>

          <div class="flex items-center gap-4 text-xs font-mono text-neutral-500 mb-6 bg-warmlight/30 border border-white/5 p-2 rounded-lg">
            <span class="px-1.5 py-0.5 bg-neutral-950 border border-neutral-800 rounded text-warmaccent-light">/</span>
            <span>Axtarışa fokuslanmaq</span>
            <span class="ml-3 px-1.5 py-0.5 bg-neutral-950 border border-neutral-800 rounded text-warmaccent-light">Esc</span>
            <span>Geri</span>
          </div>

          {!selectedCategoryId ? (
            /* --- LANDING ANA SƏHİFƏ --- */
            <div class="space-y-8 animate-fade-in">
              <div class="relative max-w-2xl mx-auto">
                <div class="relative">
                  <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-warmaccent/60"></i>
                  <input
                    ref={globalSearchRef}
                    type="text"
                    value={globalSearchQuery}
                    onChange={(e) => setGlobalSearchQuery(e.target.value)}
                    placeholder="Bütün kateqoriyalarda axtarış... ('/' düyməsi)"
                    class="w-full bg-warmlight border-2 border-warmaccent/15 focus:border-warmaccent rounded-2xl py-4 pl-12 pr-10 text-white placeholder-neutral-500 focus:outline-none transition-all shadow-lg"
                  />
                  {globalSearchQuery && (
                    <button onClick={() => setGlobalSearchQuery("")} class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white">✕</button>
                  )}
                </div>

                {globalSearchQuery.trim() !== "" && (
                  <div class="absolute left-0 right-0 mt-2 bg-[#120e09] border border-warmaccent/20 rounded-2xl shadow-2xl z-50 max-h-96 overflow-y-auto no-scrollbar">
                    {globalSearchResults.length === 0 ? (
                      <div class="p-8 text-center text-neutral-500 text-sm">Məhsul tapılmadı.</div>

                        <div
                          key={res.productId}

                            <div class="text-xs font-bold text-white mt-1">
                              <HighlightMatch text={res.matchedName} query={globalSearchQuery} />
                            </div>

                          <div class="text-right flex items-center gap-3">
                            <span class="text-[10px] bg-emerald-500/10 px-1.5 py-0.5 rounded text-emerald-400 font-bold">{res.cheapestStore}</span>
                            <span class="bg-neutral-900 border border-warmaccent/10 px-2 py-1 rounded text-xs font-mono font-bold text-warmaccent-light">
                              {res.cheapestPrice.toFixed(2)} ₼
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>

              {/* STATISTIK HUD BLOKLAR (Overview) */}
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="glass-glow p-5 rounded-2xl flex items-center gap-4">
                  <div class="w-11 h-11 bg-warmaccent/10 border border-warmaccent/25 rounded-xl flex items-center justify-center shrink-0">
                    <i data-lucide="store" class="w-5 h-5 text-warmaccent"></i>
                  </div>
                  <div>
                    <div class="text-xl font-bold font-mono text-white leading-none">{stats.totalStores}</div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-400 mt-1">Market Şəbəkəsi</div>
                  </div>
                </div>

                <div class="glass-glow p-5 rounded-2xl flex items-center gap-4">
                  <div class="w-11 h-11 bg-emerald-500/10 border border-emerald-500/25 rounded-xl flex items-center justify-center shrink-0">
                    <i data-lucide="coins" class="w-5 h-5 text-emerald-400"></i>
                  </div>
                  <div>
                    <div class="text-xl font-bold font-mono text-emerald-400 leading-none">{stats.totalItems}</div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-400 mt-1">Müqayisəli Məhsul</div>
                  </div>
                </div>

                <div class="glass-glow p-5 rounded-2xl flex items-center gap-4">
                  <div class="w-11 h-11 bg-blue-500/10 border border-blue-500/25 rounded-xl flex items-center justify-center shrink-0">
                    <i data-lucide="scale" class="w-5 h-5 text-blue-400"></i>
                  </div>
                  <div>
                    <div class="text-xl font-bold font-mono text-white leading-none">{stats.avgPrice.toFixed(2)} ₼</div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-400 mt-1">Səbət Ortalama</div>
                  </div>
                </div>

                <div class="glass-glow p-5 rounded-2xl flex items-center gap-4 border border-amber-500/20 bg-amber-500/[0.02]">
                  <div class="w-11 h-11 bg-amber-500/10 border border-amber-500/25 rounded-xl flex items-center justify-center shrink-0">
                    <i data-lucide="sparkle" class="w-5 h-5 text-amber-500 animate-pulse"></i>
                  </div>
                  <div class="min-w-0">
                    <div class="text-xl font-bold font-mono text-amber-400 leading-none">{stats.maxSaving.toFixed(2)} ₼</div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-300 mt-1 truncate">Maks. Qənaət imkanı</div>
                  </div>
                </div>
              </div>

              {/* KATEQORIYA GRID SEÇİCİSİ */}
              <div>
                <h2 class="text-sm font-bold font-display uppercase tracking-widest text-[#d4cfc3] mb-4">📂 KATEQORİYALAR üzrə sürətli keçid</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {Object.entries(initialPricesData.categories).map(([id, cat]) => {
                    const count = groupedCategories[id]?.length || 0;
                    return (
                      <div
                        key={id}
                        onClick={() => setSelectedCategoryId(id)}
                        class="glass-glow p-6 rounded-2xl cursor-pointer hover:scale-[1.02] transform transition-all flex flex-col justify-between"
                      >
                        <div class="flex justify-between items-start mb-4">
                          <span class="text-3xl">{CATEGORY_EMOJIS[id] || "🥛"}</span>
                          <span class="bg-neutral-800 text-warmaccent-light text-[10px] font-mono px-2 py-0.5 rounded-full border border-white/5">
                            {count} model
                          </span>
                        </div>
                        <div>
                          <h3 class="text-base font-bold text-white">{cat.name}</h3>
                          <p class="text-xs text-neutral-400 mt-1">Eyni kateqoriyanın məhsullarını və daxili filtr sayğaclarını açın.</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          ) : (
            /* --- KATEQORİYA DAXİLİ GÖRÜNÜŞ --- */
            <div class="space-y-6">
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <button
                  onClick={() => {
                    setSelectedCategoryId(null);
                    setSelectedSubtype(null);
                    setWeightMode("Hamısı");
                  }}
                  class="px-4 py-2 bg-warmlight border border-warmaccent/20 hover:border-warmaccent text-[#d4cfc3] hover:text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition-all cursor-pointer"
                >
                  ❮ Ana səhifəyə qayıt
                </button>

                {storeChampionsRanked.length > 0 && (
                  <div class="bg-emerald-500/[0.04] border border-emerald-500/25 px-4 py-2 rounded-xl text-xs text-emerald-300">
                     Ən sərfəli market: <strong class="text-white underline decoration-emerald-400 font-bold">{storeChampionsRanked[0][0]}</strong> ({storeChampionsRanked[0][1]} məhsulda ən ucuz qiymət)
                  </div>
                )}
              </div>

              {/* KATEQORİYA AD BAŞLIĞI */}
              <div class="glass-glow p-6 rounded-2xl flex items-center gap-4 relative overflow-hidden">
                <span class="text-4xl">{CATEGORY_EMOJIS[selectedCategoryId] || "🥛"}</span>
                <div>
                  <h2 class="text-xl font-black font-display text-white">{initialPricesData.categories[selectedCategoryId].name}</h2>
                  <p class="text-xs text-neutral-400 mt-1">Supermarketlər və Wolt çatdırılma qiymətlərinin eyni markalı qarşılıqlı Jaccard xətti ilə bərabərləşdirilməsi.</p>
                </div>
              </div>

              {/* EN SERFELI VAHID SUNULAR (Best Unit values) */}
              {unitBargains.length > 0 && (
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {unitBargains.map((bargain, index) => {
                    const theme = STORE_THEMES[bargain.storeName] || { text: "text-white", bg: "bg-neutral-800" };
                    return (
                      <div key={index} class="glass-glow p-4 rounded-xl flex items-center justify-between gap-4">
                        <div class="min-w-0">
                          <span class="text-[9px] bg-warmaccent/10 border border-warmaccent/25 px-2 py-0.5 rounded text-warmaccent font-bold uppercase">{bargain.unitLabel} üzrə hesablama</span>
                          <h4 class="text-xs font-bold text-white truncate mt-2">{bargain.productName}</h4>
                          <span class="text-[9.5px] text-neutral-400 block mt-0.5">Həqiqi qutu: {bargain.originalQty} ({bargain.originalPrice.toFixed(2)} ₼)</span>
                        </div>
                        <div class="text-right shrink-0">
                          <span class="text-xs font-mono font-bold text-white block">{bargain.pricePerUnit.toFixed(2)} ₼</span>
                          <span class={`inline-block px-1.5 py-0.5 font-black text-[9px] rounded text-neutral-900 ${theme.bg} uppercase mt-1`}>{bargain.storeName}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* FİLTR VƏ TƏNZİMLƏYİCİLƏR ALƏT PANERİ */}
              <div class="glass-glow p-5 rounded-2xl space-y-4">
                {/* 1. Növ (Subtype) chipləri */}
                <div class="space-y-1.5">
                  <span class="text-[10px] font-mono text-neutral-400 block uppercase tracking-wider">Məhsulun xüsusi növü:</span>
                  <div class="flex gap-2 items-center overflow-x-auto no-scrollbar py-1">
                    <button
                      onClick={() => setSelectedSubtype(null)}
                      class={`px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${
                        selectedSubtype === null ? 'bg-warmaccent text-neutral-950 font-bold' : 'bg-warmlight text-[#a39e93] border border-neutral-800 hover:text-white'
                      }`}
                    >
                      Hamısı
                    </button>
                    {dynamicFilterOptions.subtypes.map(sub => (
                      <button
                        key={sub}
                        onClick={() => setSelectedSubtype(sub)}
                        class={`px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${
                          selectedSubtype === sub ? 'bg-warmaccent text-neutral-950 font-bold' : 'bg-warmlight text-[#a39e93] border border-neutral-800 hover:text-white'
                        }`}
                      >
                        {sub}
                      </button>
                    ))}
                    {currentCategoryProducts.some(p => !dynamicFilterOptions.subtypes.includes(p.attributes.subtype)) && (
                      <button
                        onClick={() => setSelectedSubtype("Digər")}
                        class={`px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${
                          selectedSubtype === "Digər" ? 'bg-warmaccent text-neutral-950 font-bold' : 'bg-warmlight text-[#a39e93] border border-neutral-800 hover:text-white'
                        }`}
                      >
                        Digər
                      </button>
                    )}
                  </div>
                </div>

                {/* 2. Ölçü və çəki diapazon filtri */}
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                  <div class="space-y-1.5">
                    <span class="text-[10px] font-mono text-neutral-400 block uppercase tracking-wider">Ölçü Modu:</span>
                    <div class="bg-warmlight border border-neutral-800 rounded-xl p-0.5 flex">
                      {["Hamısı", "⚖ Çəki", "💧 Həcm"].map(mode => (
                        <button
                          key={mode}
                          onClick={() => setWeightMode(mode)}
                          class={`flex-1 py-1 text-center rounded-lg text-xs font-medium cursor-pointer transition-all ${
                            weightMode === mode ? 'bg-neutral-800 text-white font-semibold' : 'text-neutral-500 hover:text-neutral-300'
                          }`}
                        >
                          {mode}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div class="space-y-1.5">
                    <span class="text-[10px] font-mono text-neutral-400 block uppercase tracking-wider">Həcm aralığı (q / ml):</span>
                    <div class="flex items-center gap-2">
                      <input
                        type="text"
                        value={minWeightInput}
                        onChange={(e) => setMinWeightInput(e.target.value)}
                        placeholder="Min çəki"
                        class="w-full bg-warmlight border border-neutral-800 py-1.5 px-3 rounded-lg text-xs text-white"
                      />
                      <span class="text-neutral-600 font-mono text-xs">➔</span>
                      <input
                        type="text"
                        value={maxWeightInput}
                        onChange={(e) => setMaxWeightInput(e.target.value)}
                        placeholder="Maks çəki"
                        class="w-full bg-warmlight border border-neutral-800 py-1.5 px-3 rounded-lg text-xs text-white"
                      />
                    </div>
                  </div>

                  {dynamicFilterOptions.fats.length > 1 && (
                    <div class="space-y-1.5">
                      <span class="text-[10px] font-mono text-neutral-400 block uppercase tracking-wider">Südün Yağlılıq dərəcəsi:</span>
                      <div class="flex gap-1.5 items-center overflow-x-auto no-scrollbar py-0.5">
                        {dynamicFilterOptions.fats.map(perc => (
                          <button
                            key={perc}
                            onClick={() => setSelectedFatPercentage(perc === selectedFatPercentage ? null : perc)}
                            class={`px-2 py-1 rounded text-xs font-mono font-bold cursor-pointer transition-all ${
                              selectedFatPercentage === perc ? 'bg-warmaccent text-neutral-950' : 'bg-neutral-900 border border-neutral-800 text-neutral-400 hover:bg-neutral-800'
                            }`}
                          >
                            {perc}%
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Süzmələr və Sıralama nizamı */}
                <div class="border-t border-neutral-900 pt-3 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
                  <div class="text-xs text-neutral-400 font-light">
                    Siyahıda <strong class="text-warmaccent-light font-bold font-mono">{filteredCategoryProducts.length}</strong> qiymət müqayisəsi mövcuddur.
                  </div>

                  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <input
                      type="text"
                      value={tableSearchQuery}
                      onChange={(e) => setTableSearchQuery(e.target.value)}
                      placeholder="Məhsul adı ilə canlı süzgəc..."
                      class="bg-warmlight border border-neutral-800 py-1.5 px-3 rounded-lg text-xs text-white focus:outline-none focus:border-warmaccent"
                    />

                    <select
                      value={sortBy}
                      onChange={(e) => setSortBy(e.target.value)}
                      class="bg-warmlight border border-neutral-800 py-1.5 px-3 rounded-lg text-xs text-neutral-300 focus:outline-none"
                    >
                      <option value="savings_desc">Qənaət dərəcəsi: Ən yüksək</option>
                      <option value="price_asc">Qiymət: Ən ucuzdan baha</option>
                      <option value="name">Məhsul adı (A ➔ Z)</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* ESAS MƏLUMAT CƏDVƏLİ */}
              <div class="glass-glow rounded-2xl overflow-hidden border border-warmaccent/10">
                <div class="overflow-x-auto no-scrollbar">
                  <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                      <tr class="bg-warmlight/60 border-b border-warmaccent/10">
                        <th class="p-4 text-xs font-bold uppercase text-[#a39e93]">Məhsul adı & Növü</th>
                        <th class="p-4 text-xs font-bold uppercase text-center text-[#a39e93]">Ölçü/Format</th>
                        {initialPricesData.stores.map(store => {
                          const thTheme = STORE_THEMES[store] || { text: "text-white", border: "border-white/5", lightBg: "bg-white/5" };
                          return (
                            <th key={store} class="p-4 text-xs font-semibold text-center uppercase min-w-[110px]">
                              <span class={`px-2 py-1 rounded ${thTheme.lightBg} ${thTheme.text} border ${thTheme.border} text-[10px] font-bold`}>{store}</span>
                            </th>
                          );
                        })}
                        <th class="p-4 text-xs font-bold uppercase text-center text-[#a39e93] min-w-[160px]">Supermarket Qənaəti</th>
                      </tr>
                    </thead>

                    <tbody class="divide-y divide-warmaccent/5">
                      {filteredCategoryProducts.length === 0 ? (
                        <tr>
                          <td colSpan={3 + initialPricesData.stores.length} class="p-8 text-center text-neutral-500 text-sm">
                            Süzgəc parametrlərinizə uyğun heç bir supermarket məhsulu tapılmadı.
                          </td>
                        </tr>
                      ) : (
                        filteredCategoryProducts.map(prod => {
                          const storeOffers = Object.entries(prod.offers);
                          const prices = storeOffers.map(([_, off]) => isWoltPremiumMode ? off.wolt_price : off.price);
                          
                          const minPrice = prices.length > 0 ? Math.min(...prices) : 0;
                          const maxPrice = prices.length > 0 ? Math.max(...prices) : 0;
                          const saving = maxPrice - minPrice;
                          const savingPercent = maxPrice > 0 ? (saving / maxPrice) * 100 : 0;

                          const isHighlighted = highlightedProductId === prod.id;

                          return (
                            <tr
                              id={`row-${prod.id}`}
                              key={prod.id}
                              class={`transition-all duration-300 hover:bg-neutral-900/40 ${isHighlighted ? 'bg-warmaccent/20 border-y border-warmaccent/40 scale-[1.01]' : ''}`}
                            >
                              <td class="p-4">
                                <div class="font-bold text-white text-xs">{prod.name}</div>
                                <div class="flex gap-2 items-center mt-1">
                                  <span class="bg-neutral-800 text-[9px] font-bold px-1.5 py-0.5 rounded text-neutral-400 border border-white/5">{prod.attributes.subtype}</span>
                                  {prod.attributes.fatPercentage !== null && (
                                    <span class="bg-amber-500/10 text-[9px] font-bold px-1.5 py-0.5 rounded text-amber-500 border border-amber-500/10">{prod.attributes.fatPercentage}% Yağ</span>
                                  )}
                                </div>
                              </td>

                              <td class="p-4 text-center font-mono text-xs text-[#a39e93]">
                                {prod.attributes.weightValue !== null ? `${prod.attributes.weightValue} ${prod.attributes.weightUnit || ""}` : "Standart"}
                              </td>

                              {initialPricesData.stores.map(store => {
                                const offer = prod.offers[store];
                                if (!offer) {
                                  return (
                                    <td key={store} class="p-4 text-center text-[10px] text-neutral-600 font-mono italic">Yoxdur</td>
                                  );
                                }

                                const actualPrice = isWoltPremiumMode ? offer.wolt_price : offer.price;
                                const isMin = actualPrice === minPrice && prices.length > 1;
                                const isMax = actualPrice === maxPrice && prices.length > 1;

                                // Jaccard pricing ranges dynamic coloring bar helper (yaşıl ➜ sarı ➜ qırmızı)
                                let bgStyle = "bg-neutral-800/80 border-neutral-700 text-white";
                                if (isMin) bgStyle = "bg-emerald-500/15 border-emerald-500/40 text-emerald-400 font-bold scale-[1.05]";
                                if (isMax) bgStyle = "bg-red-500/10 border-red-500/20 text-red-400";

                                return (
                                  <td key={store} class="p-4 text-center">
                                    <div class={`inline-block py-1 px-2.5 rounded-lg border text-xs font-mono transition-transform ${bgStyle}`}>
                                      <span class="font-bold">{actualPrice.toFixed(2)} ₼</span>
                                      {isMin && <span class="ml-1 text-[9px] text-[#f5f2eb]">★</span>}
                                      {isMax && <span class="ml-1 text-[9px]">●</span>}
                                    </div>
                                    <span class="block text-[8.5px] text-neutral-500 font-mono mt-0.5">Wolt: {offer.wolt_price.toFixed(2)} ₼</span>
                                  </td>
                                );
                              })}

                              {/* Supermarket Qənaəti və Müqayisə Barı */}
                              <td class="p-4 text-center">
                                {prices.length <= 1 ? (
                                  <span class="text-[10px] text-neutral-600 font-bold">Müqayisəsiz</span>
                                ) : (
                                  <div class="space-y-1 inline-block text-left w-full max-w-[140px]">
                                    <div class="flex justify-between items-center text-[10px]">
                                      <span class="text-[#a39e93] font-light">Max savings:</span>
                                      <strong class="font-bold text-emerald-400 font-mono">{saving.toFixed(2)} ₼</strong>
                                    </div>
                                    <div class="w-full bg-neutral-900 rounded-full h-1.5 overflow-hidden border border-white/5 flex">
                                      <div class="bg-emerald-400 h-full rounded-full transition-all" style={{ width: `${savingPercent}%` }}></div>
                                    </div>
                                    <span class="text-[9px] font-mono text-neutral-500 block text-right mt-0.5">En ucuzundan {savingPercent.toFixed(0)}% sərfəli</span>
                                  </div>
                                )}
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
          
          {/* ALT BÖLÜM (Footer) */}
          <footer class="mt-20 border-t border-warmaccent/10 pt-6 text-center text-xs text-neutral-500 font-mono flex flex-col md:flex-row justify-between items-center gap-4">
            <div>QiymətMüqayisə © 2026. Bakı şəhəri üzrə real vaxtda kross-market qiymət indekslənməsi.</div>
            <div class="flex items-center gap-2">
              <span class="px-1.5 py-0.5 bg-neutral-950 rounded border border-neutral-800 text-[10px] text-warmaccent">V. 1.0.4 Premium</span>
            </div>
          </footer>

        </div>
      );
    }

    // Lucide ikonlarının hər yenilənmədə aktivləşdirilməsi
    function renderApp() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
      setTimeout(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, 500);
    }
    renderApp();
  </script>
</body>
</html>
