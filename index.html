<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QiymətMüqayisə — Bakı supermarket qiymətləri</title>
<meta name="description" content="Bravo, OBA, Araz və Neptun supermarketlərinin qiymətlərini bir yerdə müqayisə edin.">
<meta name="theme-color" content="#e35600">
<link rel="preload" href="data/prices.json" as="fetch" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf6ee; --card:#fff; --ink:#281505; --mute:#6b5a46; --line:#eedcc4; --soft:#f6efe2;
  --brand:#e35600; --brand-soft:#fff1e6; --good:#0f9d58; --good-soft:#e6f6ee; --bad:#d93025; --bad-soft:#fdecea;
  --shadow:0 1px 2px rgba(40,21,5,.06),0 4px 14px rgba(40,21,5,.05);
  --Bravo:#d93025; --OBA:#0b79d0; --Araz:#8e44ad; --Neptun:#0f9d58;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151009; --card:#1f1810; --ink:#f5ebdc; --mute:#b4a58f; --line:#3a2e20; --soft:#2a2118;
  --brand:#ff7a2f; --brand-soft:#33210f; --good:#3ddc84; --good-soft:#12301f; --bad:#ff6b5e; --bad-soft:#3a1a17;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}
.mono{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;
  background:none;border:0;padding:0;white-space:nowrap}
.logo i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;
  background:var(--ink);color:var(--bg);font-size:18px}
.logo b{color:var(--brand)}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:9px 12px 9px 36px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.search:before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:70vh;overflow:auto}
.results:empty{display:none}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.res:last-child{border:0}
.res:hover,.res:focus{background:var(--soft);outline:none}
.res small{color:var(--mute)}
.res strong{display:block;font-size:14px}

/* hero */
.hero{padding:26px 0 8px}
.hero h1{margin:0 0 4px;font-size:clamp(22px,4vw,32px);letter-spacing:-.03em;line-height:1.15}
.hero p{margin:0;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.stat b{display:block;font-size:24px;line-height:1.2;margin-top:2px}
.stat small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.good b{color:var(--good)}

/* store freshness */
.stores{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 11px;font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none}

/* category grid */
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:left;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-2px);border-color:var(--brand)}
.cat .em{font-size:30px;line-height:1}
.cat b{font-size:15px}
.cat small{color:var(--mute);font-size:12px}

/* category view */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0 14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 13px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.title{display:flex;align-items:center;gap:12px;margin:0}
.title span{font-size:34px}
.title h1{margin:0;font-size:26px;letter-spacing:-.02em}
.champ{margin-left:auto;background:var(--good-soft);color:var(--good);border-radius:11px;padding:7px 13px;font-size:13px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row + .row{margin-top:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-right:4px}
.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--mute)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1;min-width:0}
.scroll::-webkit-scrollbar{display:none}
.scroll .pill{flex:none}
.panel input,.panel select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;width:110px;font-size:13px;outline:none}
.panel select{width:auto}
.panel input:focus,.panel select:focus{border-color:var(--brand)}
.bargains{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.barg{background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;gap:10px}
.barg small{color:var(--mute);display:block}
.barg b{white-space:nowrap}

/* table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:var(--shadow);max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
th{position:sticky;top:0;z-index:2;background:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mute);padding:11px 12px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:220px;max-width:320px}
th:first-child{background:var(--soft);z-index:3}
th .dot{margin-right:5px}
td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
tr.hl td{background:var(--brand-soft)}
td .name{font-weight:600;font-size:14px;line-height:1.3}
td .sub{font-size:11px;color:var(--mute);margin-top:2px}
.p{font-weight:700;font-size:14px}
.p.min{color:var(--good);font-size:15px;font-weight:800}
.p.max{color:var(--bad)}
.p sup{font-size:9px;color:var(--mute);font-weight:600;margin-left:1px;cursor:help}
.na{color:var(--line);font-weight:700}
.save{font-weight:800;color:var(--good);font-size:14px}
.save small{display:block;font-size:11px;font-weight:600;background:var(--good-soft);border-radius:6px;padding:0 6px;margin-top:2px}
.more{display:block;margin:16px auto 0}
.empty{padding:50px 16px;text-align:center;color:var(--mute)}
.note{margin-top:18px;color:var(--mute);font-size:12.5px;line-height:1.6}
.note sup{font-weight:700}

/* states */
.skel{border-radius:14px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);
  background-size:400% 100%;animation:sh 1.4s infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.err{padding:40px 16px;text-align:center}
[hidden]{display:none!important}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .top .wrap{flex-wrap:wrap}
  .search{max-width:none;order:3;flex-basis:100%}
  .champ{margin-left:0}
  .tablewrap{max-height:none;overflow:visible;background:none;border:0;box-shadow:none}
  table{min-width:0}
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  td{display:block;border:0;padding:0;text-align:left}
  td:first-child{grid-column:1/-1;position:static;max-width:none;min-width:0}
  td.sz{grid-column:1/-1;font-size:12px;color:var(--mute)}
  td[data-l]:not(.sz):not(.sv):before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--mute)}
  td.sv{grid-column:1/-1}
  td.sv .save{display:flex;align-items:center;gap:8px}
  td.sv .save small{display:inline-block;margin:0}
  tr.hl{background:var(--brand-soft)}
  tr.hl td{background:none}
  td.empty{grid-column:1/-1;text-align:center}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="logo" id="home" aria-label="Ana səhifə"><i>🛒</i><span>Qiymət<b>Müqayisə</b></span></button>
  <div class="search">
    <input id="q" type="search" placeholder="Məhsul axtar: süd, banan, kartof…" autocomplete="off" aria-label="Axtarış">
    <div class="results" id="results" role="listbox"></div>
  </div>
</div></header>

<main class="wrap">
  <div id="loading">
    <div class="hero"><div class="skel" style="height:34px;width:60%"></div></div>
    <div class="stats"><div class="skel" style="height:78px"></div><div class="skel" style="height:78px"></div>
      <div class="skel" style="height:78px"></div><div class="skel" style="height:78px"></div></div>
    <div class="grid" id="skelgrid"></div>
  </div>

  <div id="error" class="err" hidden>
    <div style="font-size:42px">⚠️</div>
    <p><b>Məlumat yüklənmədi</b><br><span id="errmsg" class="mono" style="color:var(--mute)"></span></p>
    <button class="btn primary" id="retry">Yenidən cəhd et</button>
  </div>

  <section id="homeView" hidden>
    <div class="hero">
      <h1>Hansı market daha ucuzdur?</h1>
      <p>Bravo, OBA, Araz və Neptun qiymətləri bir cədvəldə.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stores" id="storeChips"></div>
    <h2 class="sec">Kateqoriyalar</h2>
    <div class="grid" id="catGrid"></div>
    <p class="note" id="srcNote"></p>
  </section>

  <section id="catView" hidden>
    <div class="bar">
      <button class="btn" id="back">← Geri</button>
      <h1 class="title"><span id="catEm"></span><span id="catName" style="font-size:26px"></span></h1>
      <div class="champ" id="champ" hidden></div>
    </div>
    <div class="bargains" id="bargains"></div>
    <div class="panel">
      <div class="row">
        <span class="lbl">Növ</span>
        <div class="scroll" id="subs"></div>
      </div>
      <div class="row">
        <span class="lbl">Ölçü</span>
        <div class="row" id="modes" style="gap:6px"></div>
        <input id="minW" type="number" min="0" placeholder="Min q/ml" aria-label="Minimum çəki">
        <input id="maxW" type="number" min="0" placeholder="Maks q/ml" aria-label="Maksimum çəki">
        <span class="lbl" id="fatLbl">Yağ</span>
        <div class="row" id="fats" style="gap:6px"></div>
      </div>
      <div class="row">
        <input id="tq" type="search" placeholder="Siyahıda süz…" style="width:200px" aria-label="Siyahıda süz">
        <span class="lbl" style="margin-left:auto">Sıralama</span>
        <select id="sort" aria-label="Sıralama">
          <option value="savings_desc">Ən çox qənaət</option>
          <option value="price_asc">Ən ucuz</option>
          <option value="name">A → Z</option>
        </select>
      </div>
      <div class="row" style="color:var(--mute);font-size:13px"><span id="count"></span></div>
    </div>
    <div class="tablewrap"><table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <button class="btn primary more" id="more" hidden>Daha çox göstər</button>
    <p class="note"><b>★ yaşıl</b> — ən ucuz, <b style="color:var(--bad)">qırmızı</b> — ən baha qiymət.
      <sup>W</sup> — qiymət Wolt-dan götürülüb və mağaza rəfindəki qiymətdən bir qədər yüksək ola bilər.</p>
  </section>
</main>

<script>
"use strict";
/* ─────────── constants ─────────── */
const EMOJI={sud:"🥛",yumurta:"🥚",kere_yagi:"🧈",pendir:"🧀",qatiq:"🫙",xama:"🥄",kefir:"🥛",ayran:"🥤",
  kartof:"🥔",pomidor:"🍅",xiyar:"🥒",soyan:"🧅",kelem:"🥬",yerkoyu:"🥕",cuqundur:"🫚",badimcan:"🍆",biber:"🌶️",
  sarimsaq:"🧄",alma:"🍎",armud:"🍐",saftal:"🍑",gilas:"🍒",uzum:"🍇",banan:"🍌",kivi:"🥝",limon:"🍋",
  portaqal:"🍊",nar:"🍎",toyuq:"🍗",dana_ati:"🥩",qoyun_ati:"🍖",hindi:"🦃",kolbasa:"🌭",sosis:"🌭",baliq:"🐟",
  duyu:"🍚",merci:"🫘",noxud:"🟡",fasulya:"🫘",qarabashaq:"🌾",yulaf:"🌾",un:"🌾",makaron:"🍝",corek:"🍞",
  pecenye:"🍪",cay:"🍵",qehve:"☕",sire:"🧃",su:"💧",kola:"🥤",energetik:"⚡",sokolad:"🍫",halva:"🍬",bal:"🍯",
  dondurma:"🍦",zeytun_yagi:"🫒",bitki_yagi:"🌻",mayonez:"🫙",ketcup:"🍅",duz:"🧂",sekerqum:"🍬",istiot:"🌶️"};
const PAGE=60;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toFixed(2)+" ₼";

/* ─────────── matching / attribute extraction ─────────── */
const TR={"ç":"c","ə":"e","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u"};
function tokens(str){
  return new Set(str.toLowerCase().replace(/[çəğıöşü]/g,c=>TR[c]).replace(/[^\w\s]/g," ").split(/\s+/).filter(Boolean));
}
function jaccard(a,b){
  let i=0; for(const t of a) if(b.has(t)) i++;
  const u=a.size+b.size-i; return u?i/u:1;
}
const STOP=new Set(["sabun","şampun","yuyucu","dezodorant","krem","losyon","jel","maye","plastik","şüşə","qabda","qalib",
  "mini","maxi","vita","nano","bio","eco","premium","classic","original","special","super","ultra","mega","extra",
  "ve","ilə","üçün","olan","həm","da","də","ki","bu","bir","bütün"]);
const isAdj=w=>/[lL][ıiuüIİUÜ]$/.test(w);
const AL="[a-zA-ZğüşıöçĞÜŞIÖÇəƏ]";
function productType(name){
  const m=name.match(new RegExp("\\d[\\d.,]*\\s*(?:%|kq|kg|litr|lt(?!"+AL+")|ml(?!"+AL+")|[lL](?!"+AL+")|[qQgG][rR]?(?!"+AL+"))"));
  const before=name.slice(0,m?m.index:name.length).trim();
  const w=(before||name).split(/\s+/).filter(x=>/^\p{L}+$/u.test(x));
  if(!w.length) return "Digər";
  const up=x=>x[0].toUpperCase()+x.slice(1);
  if(w.length<2) return up(w[0]);
  for(let i=1;i<w.length;i++){ if(isAdj(w[i])||STOP.has(w[i].toLowerCase())) continue; return up(w[i]); }
  return up(w[w.length-1]);
}
const WPATS=[[/(\d+[.,]?\d*)\s*kq(?!AL)/i,"kq"],[/(\d+[.,]?\d*)\s*kg(?!AL)/i,"kq"],[/(\d+[.,]?\d*)\s*litr/i,"L"],
  [/(\d+[.,]?\d*)\s*lt(?!AL)/i,"L"],[/(\d+[.,]?\d*)\s*[lL](?!AL)/,"L"],[/(\d+[.,]?\d*)\s*ml(?!AL)/i,"ml"],
  [/(\d+[.,]?\d*)\s*gr(?!AL)/i,"q"],[/(\d+[.,]?\d*)\s*[gG](?!AL)/,"q"],[/(\d+[.,]?\d*)\s*qr?(?!AL)/i,"q"]]
  .map(([r,u])=>[new RegExp(r.source.replace(/AL/g,AL),r.flags),u]);
function attrs(name){
  let fat=null; const f=name.match(/(\d+[.,]?\d*)\s*%/);
  if(f){const v=parseFloat(f[1].replace(",","."));if(!isNaN(v))fat=v;}
  let wv=null,wu=null;
  for(const [re,u] of WPATS){const m=name.match(re); if(m){const v=parseFloat(m[1].replace(",","."));if(v>0){wv=v;wu=u;break;}}}
  if(!wv){
    if(/10-luq|10\s*[əea]d[əe]d|10\s*adet/i.test(name)){wv=10;wu="ədəd";}
    else if(/15-lik|15\s*[əe]d[əe]d/i.test(name)){wv=15;wu="ədəd";}
    else if(/30-luq|30\s*[əe]d[əe]d/i.test(name)){wv=30;wu="ədəd";}
    else if(/6-l[ıi]q|6\s*[əe]d[əe]d/i.test(name)){wv=6;wu="ədəd";}
  }
  return {subtype:productType(name),wv,wu,fat};
}
const norm=(v,u)=>v==null||!u?null:(u==="kq"||u==="L")?v*1000:v;

/* group products across stores (inverted index: only compare names that share a token) */
function group(cat){
  const out=[], idx=new Map(); let n=1;
  for(const store of Object.keys(cat.stores||{})){
    for(const it of cat.stores[store]||[]){
      const tk=tokens(it.name); let best=null,bs=0; const seen=new Set();
      for(const t of tk){
        const l=idx.get(t); if(!l) continue;
        for(const e of l){ if(seen.has(e)) continue; seen.add(e);
          const s=jaccard(e.tk,tk); if(s>bs){bs=s;best=e.g;} }
      }
      if(best&&bs>=.5){ if(!best.offers[store]) best.offers[store]=mk(it); continue; }
      const g={id:"p"+n++,name:it.name,a:attrs(it.name),offers:{[store]:mk(it)},lc:it.name.toLowerCase()};
      out.push(g); const e={g,tk};
      for(const t of tk){ (idx.get(t)||idx.set(t,[]).get(t)).push(e); }
    }
  }
  for(const g of out){ // precompute price stats once
    const v=Object.values(g.offers).map(o=>o.p);
    g.n=v.length; g.min=Math.min(...v); g.max=Math.max(...v); g.save=g.n>1?g.max-g.min:0;
  }
  return out;
}
function mk(it){ const own=it.price!=null; return {p:own?it.price:(it.wolt_price||0), w:!own}; }

/* ─────────── state ─────────── */
let DB=null; const GROUPS={}; let stores=[];
let cur=null, filtered=[], shown=PAGE, hl=null;
const F={sub:null,mode:"Hamısı",min:"",max:"",fat:null,q:"",sort:"savings_desc"};
const groups=id=>GROUPS[id]||(GROUPS[id]=group(DB.categories[id]));

/* ─────────── load ─────────── */
async function load(){
  $("loading").hidden=false; $("error").hidden=true;
  try{
    const r=await fetch("data/prices.json"); if(!r.ok) throw new Error("HTTP "+r.status);
    DB=await r.json(); stores=DB.stores||[];
    renderHome(); route();
  }catch(e){ $("errmsg").textContent=e.message; $("error").hidden=false; }
  finally{ $("loading").hidden=true; }
}

/* ─────────── home ─────────── */
function renderHome(){
  const cats=Object.entries(DB.categories);
  const raw=id=>Object.values(DB.categories[id].stores).reduce((a,l)=>a+l.length,0);
  const shownCats=cats.filter(([id])=>raw(id)>0).sort((a,b)=>raw(b[0])-raw(a[0]));
  $("catGrid").innerHTML=shownCats.map(([id,c])=>
    `<button class="cat" data-id="${id}"><span class="em">${EMOJI[id]||"📦"}</span><b>${esc(c.name)}</b>
     <small>${raw(id)} qiymət</small></button>`).join("");
  const total=shownCats.reduce((a,[id])=>a+raw(id),0);
  $("stats").innerHTML=stat("Mağaza",stores.length,"Bravo · OBA · Araz · Neptun")+
    stat("Kateqoriya",shownCats.length,"ərzaq qrupu")+stat("Qiymət qeydi",total.toLocaleString("az"),"bütün mağazalar üzrə")+
    `<div class="stat good"><span>Maks. qənaət</span><b id="maxSave">…</b><small id="maxSaveP">hesablanır</small></div>`;
  const meta=DB.meta||{};
  $("storeChips").innerHTML=stores.map(s=>{
    const m=meta[s], n=cats.reduce((a,[,c])=>a+(c.stores[s]||[]).length,0);
    return `<span class="chip" style="--c:var(--${s})"><span class="dot"></span><b>${s}</b> ${n?n+" məhsul":"məlumat yoxdur"}${m?` · ${esc(m.updated)}`:""}</span>`;
  }).join("");
  $("srcNote").innerHTML=`Son yenilənmə: <b>${esc(DB.last_updated||"—")}</b>. Mağazanın öz saytından alınan qiymətlər dəqiqdir;
    Wolt-dan alınanlar <sup>W</sup> ilə işarələnib və rəfdəki qiymətdən bir qədər yüksək ola bilər.`;
  // heavy stats computed after first paint, in small slices
  let i=0,best=0,bp="",ids=shownCats.map(x=>x[0]);
  (function step(){
    const t=performance.now();
    while(i<ids.length&&performance.now()-t<12){
      for(const g of groups(ids[i])) if(g.save>best){best=g.save;bp=g.name;} i++;
    }
    if($("maxSave")){ $("maxSave").textContent="+ "+fmt(best); $("maxSaveP").textContent=bp||"—"; }
    if(i<ids.length) (window.requestIdleCallback||setTimeout)(step);
  })();
}
const stat=(l,v,s)=>`<div class="stat"><span>${l}</span><b class="mono">${v}</b><small>${s}</small></div>`;

/* ─────────── category view ─────────── */
function openCat(id,focus){
  cur=id; hl=focus||null; shown=PAGE;
  Object.assign(F,{sub:null,mode:"Hamısı",min:"",max:"",fat:null,q:"",sort:"savings_desc"});
  $("minW").value=$("maxW").value=$("tq").value=""; $("sort").value=F.sort;
  $("catEm").textContent=EMOJI[id]||"📦"; $("catName").textContent=DB.categories[id].name;
  $("thead").innerHTML="<tr><th>Məhsul</th><th>Ölçü</th>"+stores.map(s=>`<th><span class="dot" style="--c:var(--${s})"></span>${s}</th>`).join("")+"<th>Qənaət</th></tr>";
  const gs=groups(id), subs=new Map(), fats=new Set();
  gs.forEach(g=>{subs.set(g.a.subtype,(subs.get(g.a.subtype)||0)+1); if(g.a.fat!=null)fats.add(g.a.fat);});
  const top=[...subs].sort((a,b)=>b[1]-a[1]).slice(0,40).map(x=>x[0]).sort((a,b)=>a.localeCompare(b,"az"));
  $("subs").innerHTML=pill("Hamısı",null,"sub")+top.map(s=>pill(s,s,"sub")).join("");
  $("modes").innerHTML=["Hamısı","⚖ Çəki","💧 Həcm","📦 Digər"].map(m=>pill(m,m,"mode")).join("");
  const fl=[...fats].sort((a,b)=>a-b); $("fatLbl").hidden=$("fats").hidden=fl.length<2;
  $("fats").innerHTML=fl.length<2?"":pill("Hamısı",null,"fat")+fl.map(f=>pill(f+"%",f,"fat")).join("");
  // champion + unit bargains
  const cnt={}; gs.forEach(g=>{ if(g.n<2)return; for(const[s,o]of Object.entries(g.offers)) if(o.p===g.min) cnt[s]=(cnt[s]||0)+1; });
  const ch=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $("champ").hidden=!ch; if(ch) $("champ").textContent=`🏆 Ən sərfəli: ${ch[0]} (${ch[1]} məhsulda ən ucuz)`;
  const kg=[],lt=[];
  gs.forEach(g=>{ const {wv:v,wu:u}=g.a; if(!v||!u)return;
    for(const[s,o]of Object.entries(g.offers)){
      if(u==="kq"||u==="q"){const q=u==="kq"?v:v/1000; q>0&&kg.push({l:"1 kq",n:g.name,s,u:o.p/q,o:o.p,q:v+" "+u});}
      else if(u==="L"||u==="ml"){const q=u==="L"?v:v/1000; q>0&&lt.push({l:"1 L",n:g.name,s,u:o.p/q,o:o.p,q:v+" "+u});}
    }});
  const bst=a=>a.sort((x,y)=>x.u-y.u)[0];
  $("bargains").innerHTML=[kg,lt].filter(a=>a.length).map(bst).map(b=>
    `<div class="barg"><div style="min-width:0"><small>✨ ${b.l} üzrə ən ucuz</small><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.n)}</b>
     <small>${esc(b.q)} · ${fmt(b.o)} · ${esc(b.s)}</small></div><b class="mono">${fmt(b.u)}</b></div>`).join("");
  syncPills(); apply();
}
const pill=(label,val,k)=>`<button class="pill" data-k="${k}" data-v="${val==null?"":esc(val)}">${esc(label)}</button>`;
function syncPills(){
  document.querySelectorAll(".pill").forEach(b=>{
    const k=b.dataset.k, v=b.dataset.v, cv=F[k];
    b.classList.toggle("on",(cv==null&&v==="")||(cv!=null&&String(cv)===v));
  });
}
function apply(){
  let l=groups(cur).slice();
  if(F.sub) l=l.filter(g=>g.a.subtype===F.sub);
  if(F.mode!=="Hamısı") l=l.filter(g=>{const u=g.a.wu;
    return F.mode==="⚖ Çəki"?(u==="kq"||u==="q"):F.mode==="💧 Həcm"?(u==="L"||u==="ml"):(u==="ədəd"||u==null);});
  const mn=parseFloat(F.min), mx=parseFloat(F.max);
  if(!isNaN(mn)) l=l.filter(g=>{const n=norm(g.a.wv,g.a.wu);return n!=null&&n>=mn;});
  if(!isNaN(mx)) l=l.filter(g=>{const n=norm(g.a.wv,g.a.wu);return n!=null&&n<=mx;});
  if(F.fat!=null) l=l.filter(g=>g.a.fat===+F.fat);
  if(F.q.trim()){const q=F.q.trim().toLowerCase(); l=l.filter(g=>g.lc.includes(q)||g.a.subtype.toLowerCase().includes(q));}
  if(F.sort==="name") l.sort((a,b)=>a.name.localeCompare(b.name,"az"));
  else if(F.sort==="price_asc") l.sort((a,b)=>a.min-b.min);
  else l.sort((a,b)=>b.save-a.save||b.n-a.n);
  filtered=l; shown=Math.max(shown,PAGE); render();
}
function cell(g,s){
  const o=g.offers[s]; if(!o) return `<td data-l="${s}"><span class="na">—</span></td>`;
  const c=g.n>1?(o.p===g.min?" min":o.p===g.max?" max":""):"";
  return `<td data-l="${s}"><span class="p mono${c}">${c===" min"?"★ ":""}${fmt(o.p)}${o.w?`<sup title="Wolt qiyməti">W</sup>`:""}</span></td>`;
}
function render(){
  const list=filtered.slice(0,shown);
  $("count").textContent=`${filtered.length} məhsul qrupu`;
  $("tbody").innerHTML=list.length?list.map(g=>{
    const a=g.a, size=a.wv?`${a.wv} ${a.wu}`:"—", fat=a.fat!=null?` · ${a.fat}%`:"";
    return `<tr id="r-${g.id}"${hl===g.id?' class="hl"':""}><td><div class="name">${esc(g.name)}</div>
      <div class="sub">${esc(a.subtype)}${g.n<stores.length?` · ${stores.length-g.n} mağazada yoxdur`:""}</div></td>
      <td class="mono sz" data-l="Ölçü" style="white-space:nowrap">${size}${fat}</td>${stores.map(s=>cell(g,s)).join("")}
      <td class="sv" data-l="Qənaət">${g.n>1?`<div class="save mono">+ ${fmt(g.save)}<small>${(g.save/g.max*100).toFixed(0)}%</small></div>`:'<span class="na">—</span>'}</td></tr>`;
  }).join(""):`<tr><td colspan="${stores.length+3}" class="empty">Filtrə uyğun məhsul tapılmadı.</td></tr>`;
  $("more").hidden=shown>=filtered.length;
  $("more").textContent=`Daha çox göstər (${filtered.length-shown} qalıb)`;
}

/* ─────────── routing (hash) ─────────── */
function route(){
  if(!DB) return;
  const m=location.hash.match(/^#\/c\/([\w-]+)(?:\/(p\d+))?/);
  if(m&&DB.categories[m[1]]){
    $("homeView").hidden=true; $("catView").hidden=false; openCat(m[1],m[2]);
    if(m[2]) setTimeout(()=>{const r=$("r-"+m[2]); r&&r.scrollIntoView({block:"center"});},50);
    else window.scrollTo(0,0);
  }else{ $("catView").hidden=true; $("homeView").hidden=false; }
}
addEventListener("hashchange",route);
const go=h=>{ location.hash===h?route():(location.hash=h); };

/* ─────────── events ─────────── */
$("home").onclick=()=>{ $("q").value=""; $("results").innerHTML=""; go("#/"); };
$("back").onclick=()=>go("#/");
$("retry").onclick=load;
$("catGrid").onclick=e=>{const b=e.target.closest(".cat"); if(b) go("#/c/"+b.dataset.id);};
$("catView").addEventListener("click",e=>{
  const b=e.target.closest(".pill"); if(!b) return;
  const k=b.dataset.k, v=b.dataset.v;
  F[k]=k==="mode"?v:(v===""?null:v); syncPills(); hl=null; shown=PAGE; apply();
});
$("more").onclick=()=>{shown+=PAGE;render();};
const debounce=(f,t=120)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>f(...a),t);};};
$("minW").oninput=debounce(e=>{F.min=e.target.value;shown=PAGE;apply();});
$("maxW").oninput=debounce(e=>{F.max=e.target.value;shown=PAGE;apply();});
$("tq").oninput=debounce(e=>{F.q=e.target.value;shown=PAGE;apply();});
$("sort").onchange=e=>{F.sort=e.target.value;apply();};

/* global search */
$("q").oninput=debounce(e=>{
  const q=e.target.value.trim().toLowerCase(), box=$("results");
  if(q.length<2){box.innerHTML="";return;}
  const res=[];
  for(const id of Object.keys(DB.categories)){
    for(const g of groups(id)){
      if(g.lc.includes(q)) res.push([id,g]);
      if(res.length>=400) break;
    }
  }
  res.sort((a,b)=>b[1].n-a[1].n||a[1].min-b[1].min);
  box.innerHTML=res.slice(0,8).map(([id,g])=>
    `<button class="res" data-go="#/c/${id}/${g.id}"><small>${EMOJI[id]||"📦"} ${esc(DB.categories[id].name)}</small>
     <strong>${esc(g.name)}</strong><small class="mono">${Object.entries(g.offers).map(([s,o])=>s+" "+fmt(o.p)).join(" · ")}</small></button>`).join("")
     ||'<div class="res"><small>Heç nə tapılmadı</small></div>';
},150);
$("results").onclick=e=>{const b=e.target.closest("[data-go]"); if(!b)return; $("results").innerHTML=""; $("q").value=""; go(b.dataset.go);};
addEventListener("keydown",e=>{ if(e.key==="Escape"){$("results").innerHTML="";$("q").blur();} });
addEventListener("click",e=>{ if(!e.target.closest(".search")) $("results").innerHTML=""; });

$("skelgrid").innerHTML=Array(8).fill('<div class="skel" style="height:104px"></div>').join("");
load();
</script>
</body>
</html>
